packages:
  - apps/*
  - packages/*
  - infra/mock-providers
  - infra/mock-citizen-app
  - tests/*

# pnpm 11 blocks dependency install scripts unless explicitly allowed here.
allowBuilds:
  # Ships prebuilt binaries per platform; its script only builds from source as a fallback.
  '@parcel/watcher': false
  # Downloads the Prisma schema/migration engine binaries.
  '@prisma/engines': true
  # Install-time telemetry pulled in by swagger-ui-dist: never allowed.
  '@scarf/scarf': false
  '@swc/core': true
  # Verifies the platform binary (used by tsx for the database seed).
  esbuild: true
  prisma: true
  # Local file-copy script that selects the Vue 3 build (Scalar API reference).
  vue-demi: true

# `pnpm audit` (CI) exceptions, each with its reason and when to remove it.
auditConfig:
  ignoreGhsas:
    # picomatch ReDoS (high), 2026-11-17: development only (ESLint, through
    # @next/eslint-plugin-next > fast-glob), in no image. No fixed release exists yet (>=4.0.8);
    # remove this line once it is published and the lockfile picks it up.
    - GHSA-fc5q-39xc-vjpf

minimumReleaseAgeExclude:
  - effect@3.22.5

# Security overrides (pnpm audit --audit-level high runs in CI). Each one names the advisory and
# the dependency that pulls the vulnerable version; drop it when that dependency ships the fix.
overrides:
  # GHSA-7589-6fvf-x4pw: ReDoS in Effect's Schema.TemplateLiteral, <= 3.22.0. Stay on 3.x: 4.x breaks prisma's config loader. Only prisma's config
  # loader (@prisma/config) uses it, at build and migration time, never in a request.
  effect: '^3.22.1'
