# pgBackRest for the Compose PostgreSQL (M6-06, ADR-0026). The same file serves the database
# container (archive-push of each WAL segment) and the `pgbackrest` service (backups, restores).
# From the environment: PGBACKREST_PG1_USER (the superuser, POSTGRES_USER) and
# PGBACKREST_REPO1_CIPHER_PASS (the repository's encryption key: without it the backups cannot be
# read, so a copy lives off the server, OPERATIONS.md §6).
[global]
repo1-path=/var/lib/pgbackrest
# Encrypted at rest: a copy of the repository can leave the server as is.
repo1-cipher-type=aes-256-cbc
# Four full backups (one a week by default) with their differentials and the WAL in between:
# point-in-time recovery to any moment of the last four weeks.
repo1-retention-full-type=count
repo1-retention-full=4
compress-type=zst
process-max=2
# The backup starts with an immediate checkpoint instead of waiting for the next one.
start-fast=y
# Logs to the container's output only, never to files (the operator's collector reads them).
log-level-console=info
log-level-file=off

[rid]
pg1-path=/var/lib/postgresql/18/docker
pg1-socket-path=/var/run/postgresql
