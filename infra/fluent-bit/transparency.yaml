# Transparency pipeline (ADR-0015, ARCHITECTURE.md §13): APISIX tcp-logger -> filter -> portal
# collector. Records carry the keyed pseudonym of the data subject, never the document number, the
# path or any content. Separate from the analytics pipeline (fluent-bit.yaml), which has no data
# subject at all.
service:
  flush: 1
  log_level: warn
  http_server: on
  http_listen: 0.0.0.0
  # The health endpoint; its port comes from the environment: sidecars of one pod need their own.
  http_port: ${FLUENT_BIT_HTTP_PORT}
  health_check: on
  # Chunks live on disk until the collector accepts them: a portal restart loses nothing.
  storage.path: /var/lib/fluent-bit/transparency
  storage.sync: full
  storage.checksum: on
  storage.backlog.mem_limit: 16M

pipeline:
  inputs:
    - name: tcp
      listen: 0.0.0.0
      port: 5170
      format: json
      tag: den.transparency
      storage.type: filesystem
      # APISIX's tcp-logger sends each batch (batch_max_size 100) as one JSON array, and the
      # input drops any message larger than its buffer, whole and in silence (A-3); the default
      # (chunk_size, 32 KB) held about 50 records. A record is under 1 KB, and under 9 KB even
      # from a gateway on the old log format with an oversized X-Request-Id, so 4 MB holds a
      # full batch several times over. Memory grows in chunk_size steps only as a message needs.
      # In KB, a bare number: this input reads "4M" as 4 KB.
      buffer_size: 4096

  filters:
    - name: lua
      match: den.transparency
      script: /fluent-bit/etc/den/transparency.lua
      call: transparency

  outputs:
    - name: http
      match: den.transparency
      host: ${DEN_TRANSPARENCY_COLLECTOR_HOST}
      port: ${DEN_TRANSPARENCY_COLLECTOR_PORT}
      uri: /api/v1/internal/subject-access
      format: json
      json_date_key: false
      header: Authorization Bearer ${DEN_TRANSPARENCY_INGEST_TOKEN}
      # Keep retrying: a record lost here is a consultation the citizen never sees.
      retry_limit: no_limits
      storage.total_limit_size: 1G
