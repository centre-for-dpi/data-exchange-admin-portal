# Access-log pipeline: APISIX http-logger -> allowlist filter -> OpenSearch.
# Only metadata fields are kept (ARCHITECTURE.md §8, ADR-0006). Second privacy barrier after APISIX.
service:
  flush: 1
  log_level: info
  http_server: on
  http_listen: 0.0.0.0
  http_port: 2020
  health_check: on

pipeline:
  inputs:
    - name: http
      listen: 0.0.0.0
      port: 9880
      tag: apisix.access

  filters:
    - name: lua
      match: apisix.*
      script: /fluent-bit/etc/rid/allowlist.lua
      call: allowlist

  outputs:
    - name: opensearch
      match: apisix.*
      host: opensearch
      port: 9200
      logstash_format: on
      logstash_prefix: rid-access
      logstash_dateformat: '%Y.%m'
      suppress_type_name: on
      trace_error: on
