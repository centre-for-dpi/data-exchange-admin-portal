# Prometheus of the RID portal + gateway (ARCHITECTURE.md §9, M5-06). Observability profile.
# Scrapes the gateway, the portal API and OPA; evaluates the alerts of rules/rid.rules.yml and
# sends them to Alertmanager. Metrics carry route ids, states and kinds, never personal data.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # APISIX's prometheus plugin, on its internal export port (infra/apisix/config.yaml).
  - job_name: apisix
    metrics_path: /apisix/prometheus/metrics
    static_configs:
      - targets: ['apisix:9091']

  # The portal API (apps/api, GET /metrics). In development the API runs on the host: the
  # compose file points `api` there. The token is RID_METRICS_TOKEN, written to this file when
  # the container starts.
  - job_name: api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/rid/metrics-token
    static_configs:
      - targets: ['api:4000']

  # OPA, with its bundle status metrics (infra/opa/config.yaml, status.prometheus).
  - job_name: opa
    static_configs:
      - targets: ['opa:8181']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']
