# Alerts of the DEN portal + gateway (ARCHITECTURE.md §9, M5-06). Tested with promtool
# (infra/prometheus/tests/den.rules.test.yml, run by tests/infra). Texts for the operator.
groups:
  - name: den-gateway
    rules:
      - alert: DenGateway5xxRate
        # More than 2 % of the gateway's answers were 5xx over 5 minutes.
        expr: |
          sum(rate(apisix_http_status{code=~"5.."}[5m]))
            / clamp_min(sum(rate(apisix_http_status[5m])), 1e-9) > 0.02
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Más del 2 % de las respuestas del gateway son 5xx'
          description: '{{ $value | humanizePercentage }} de respuestas 5xx en los últimos 5 minutos.'

      - alert: DenGatewayLatencyHigh
        # p95 of the whole request at the gateway, upstream included, in milliseconds.
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(apisix_http_latency_bucket{type="request"}[5m]))) > 200
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'La latencia p95 del gateway pasa de 200 ms'
          description: 'p95 de {{ $value | humanize }} ms en los últimos 5 minutos.'

      - alert: DenTargetDown
        expr: up{job=~"apisix|api|opa"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.job }} no responde a Prometheus'
          description: 'El objetivo {{ $labels.instance }} lleva 2 minutos sin responder.'

  - name: den-policy
    rules:
      - alert: DenOpaBundleBehind
        # OPA still runs an older bundle more than 2 minutes after the current one was built.
        expr: den_opa_bundle_lag_seconds > 120
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'OPA aplica un bundle con más de 2 minutos de atraso'
          description: 'Las suscripciones aprobadas o revocadas no llegan al gateway ({{ $value | humanizeDuration }}).'

      - alert: DenOpaBundleFetchFailing
        # OPA has not fetched the bundle from the portal for more than 2 minutes.
        expr: time() - last_success_bundle_request{name="den"} / 1e9 > 120
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'OPA no descarga el bundle del portal hace más de 2 minutos'
          description: 'Última descarga exitosa hace {{ $value | humanizeDuration }}.'

  - name: den-portal
    rules:
      - alert: DenReconcileFailing
        expr: sum by (system) (den_sync_targets{status="error"}) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'La reconciliación con {{ $labels.system }} está fallando'
          description: '{{ $value }} objetos en error: ver la consola de sincronización del operador.'

      - alert: DenNodeOffline
        expr: den_nodes{status="offline"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Hay nodos del kit fuera de línea'
          description: '{{ $value }} nodos sin heartbeat: ver la consola de nodos.'

      - alert: DenCertificateExpiring
        # The gateway's certificate and the nodes' renew themselves: one this close to expiry means
        # the renewal is failing.
        expr: den_certificate_soonest_expiry_seconds{kind=~"gateway|node"} < 14 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: 'Un certificado de tipo {{ $labels.kind }} vence en menos de 14 días'
          description: 'Vence en {{ $value | humanizeDuration }}.'

      - alert: DenQueueBacklog
        expr: sum(den_queue_jobs{state=~"created|retry"}) > 100
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'La cola de trabajos en segundo plano se acumula'
          description: '{{ $value }} trabajos esperando desde hace 15 minutos.'

  # Transparency register (ADR-0015, ADR-0016): a consultation that is not recorded, sealed and
  # stamped is one the citizen cannot see or prove.
  - name: den-transparency
    rules:
      - alert: DenTransparencyRecordsDropped
        # The collector dropped records of calls the gateway let through (A-3, A-4).
        expr: sum by (reason) (increase(den_transparency_records_dropped_total[10m])) > 0
        labels:
          severity: critical
        annotations:
          summary: 'El registro de transparencia descarta consultas ({{ $labels.reason }})'
          description: '{{ $value | humanize }} registros descartados en 10 minutos: los ciudadanos no verán esas consultas. Ver los logs del API.'

      - alert: DenTransparencyUnsealed
        # Records waiting for their batch beyond a few sealing rounds (B-19): no receipt for them.
        expr: max(den_transparency_unsealed_oldest_seconds) > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Hay consultas sin sellar en el registro de transparencia'
          description: 'La más antigua espera su lote desde hace {{ $value | humanizeDuration }}: ver los logs del API (sellador, DEN_TRANSPARENCY_SIGNING_JWK).'

      - alert: DenTransparencyUnstamped
        # Sealed batches the TSA has not stamped (B-19): their time rests on the operator's word.
        expr: max(den_transparency_unstamped_oldest_seconds) > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Hay lotes de transparencia sin sello de tiempo'
          description: 'El más antiguo espera a la TSA desde hace {{ $value | humanizeDuration }}: la TSA no responde o rechaza las peticiones (DEN_TSA_URL).'

  # Audit trail (ARCHITECTURE.md §7): the daily anchor is what protects the chain's tail against
  # whoever owns the database.
  - name: den-audit
    rules:
      - alert: DenAuditAnchorOverdue
        # A day that ended has no anchor (B-02): the TSA does not answer, the anchoring fails, or an
        # anchor dated in the future is blocking it. The anchoring runs hourly, so hours of lag are
        # not a slow job.
        expr: max(den_audit_anchor_overdue_seconds) > 6 * 3600
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: 'La bitácora de auditoría tiene un día sin anclar'
          description: 'El día más antiguo sin anclar terminó hace {{ $value | humanizeDuration }}: ver los logs del API (anclaje, DEN_TSA_URL) y /audit/verify (anclajes con fecha futura).'
