# Alertmanager of the DEN portal + gateway (M5-06). Groups the alerts of
# infra/prometheus/rules/den.rules.yml and sends them by e-mail to the operator. Development
# delivers to Mailpit. entrypoint.sh replaces the global section and the receiver's address with
# the operator's (DEN_ALERT_SMTP_*, DEN_ALERT_EMAIL_TO, M-28) when .env sets them.
global:
  smtp_smarthost: 'mailpit:1025'
  smtp_from: 'alertas@den.example'
  smtp_require_tls: false

route:
  receiver: operator
  group_by: ['alertname', 'system', 'kind']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: operator
      repeat_interval: 1h

receivers:
  - name: operator
    email_configs:
      - to: 'operaciones@den.example'
        send_resolved: true
