{{- /*
What the observability subcharts read from this chart: the alert rules of infra/prometheus and the
operator's dashboard of infra/grafana (copied by `pnpm helm:sync`).
*/}}
{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rid.name" "prometheus-rules" }}
  labels:
    {{- include "rid.labels" (dict "root" . "component" "prometheus") | nindent 4 }}
data:
  rid.rules.yml: |
    {{- .Files.Get "files/prometheus/rid.rules.yml" | nindent 4 }}
{{- end }}
{{- if .Values.grafana.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rid.name" "grafana-dashboards" }}
  labels:
    {{- include "rid.labels" (dict "root" . "component" "grafana") | nindent 4 }}
data:
  rid-operator.json: |
    {{- .Files.Get "files/grafana/rid-operator.json" | nindent 4 }}
{{- end }}
