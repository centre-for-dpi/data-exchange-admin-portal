{{- /*
Each component's Secret, rid-<component>, with only its keys (_helpers.tpl, rid.secretKeys).
externalSecrets: External Secrets Operator copies them from one entry of the secret store
(secrets.externalSecrets.remoteKey), each key a property of it. existing: the operator created them.
*/ -}}
{{- if eq .Values.secrets.mode "externalSecrets" }}
{{- $root := . }}
{{- $es := .Values.secrets.externalSecrets }}
{{- range $component, $keys := include "rid.secretKeys" . | fromYaml }}
{{- if eq (include "rid.enabled" (dict "root" $root "component" $component)) "true" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "rid.name" $component }}
  labels:
    {{- include "rid.labels" (dict "root" $root "component" $component) | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    name: {{ include "rid.name" $component }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range $keys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $es.remoteKey }}
        property: {{ . }}
    {{- end }}
{{- end }}
{{- end }}
{{- else if ne .Values.secrets.mode "existing" }}
{{- fail "secrets.mode must be externalSecrets or existing" }}
{{- end }}
