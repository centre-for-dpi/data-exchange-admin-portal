# Values of the RID chart (M6-05). docs/DEPLOYMENT.md §9 explains each block; the defaults are the
# production topology of docs/ARCHITECTURE.md §11. Nothing country-specific here: the country is
# config/country/<code>.yaml, chosen with `country` (CLAUDE.md, rule 6).

# --- The deployment ------------------------------------------------------------------------------

# config/country/<code>.yaml baked in the API and web images.
country: co

# The portal's public URL (web, API under /api/v1, Keycloak under /auth): one host behind the ingress.
publicUrl: https://rid.example.org

# The gateway's own public name. With mTLS (features.mtls.required) applications reach it on this
# name, whose TLS the gateway terminates: it is not behind the portal's ingress.
gatewayHost: gw.rid.example.org
# Only when applications reach it on another port than 443 (test clusters).
gatewayPublicUrl: ''

imagePullSecrets: []

images:
  api:
    repository: ghcr.io/centre-for-dpi/rid-portal-api
    tag: '' # appVersion when empty
  web:
    repository: ghcr.io/centre-for-dpi/rid-portal-web
    tag: ''
  wgHub:
    repository: ghcr.io/centre-for-dpi/rid-wg-hub
    tag: ''
  contractRunner:
    repository: ghcr.io/centre-for-dpi/rid-contract-runner
    tag: ''
  apisix: apache/apisix:3.19.0-debian
  opa: openpolicyagent/opa:1.21.4-static
  # Not the -debug image (ASVS 13.4.2): the probes are HTTP, no shell needed.
  fluentBit: fluent/fluent-bit:5.1.5
  etcd: quay.io/coreos/etcd:v3.6.16
  pullPolicy: IfNotPresent

# --- Secrets -------------------------------------------------------------------------------------
#
# Each component gets a Secret with only the keys it uses (rid-<component>; the keys are listed in
# docs/DEPLOYMENT.md §9.2). Two ways to fill them:
#   externalSecrets: External Secrets Operator reads them from a secret store (OpenBao, the open
#     fork of Vault, or any ESO backend): one entry, `remoteKey`, with every key as a property.
#     Rotation: change the value in the store; ESO refreshes the Secret within refreshInterval.
#     The pods read their secrets at start: restart them (`kubectl rollout restart`) or let
#     Reloader do it (DEPLOYMENT.md §9.3, and the order of each rotation in OPERATIONS.md §5.6).
#   existing: the Secrets already exist in the namespace, created by the operator.
secrets:
  mode: externalSecrets # externalSecrets | existing
  externalSecrets:
    secretStoreRef:
      name: openbao
      kind: ClusterSecretStore
    remoteKey: rid/platform
    refreshInterval: 1h

# --- Portal --------------------------------------------------------------------------------------

api:
  replicas: 2
  port: 4000
  # The first platform administrator (RID_BOOTSTRAP_ADMIN_EMAIL): whoever signs in first with this
  # address, verified, while the network has none. Remove it once they are in.
  bootstrapAdminEmail: ''
  # Proxies allowed to set X-Forwarded-For (RID_TRUST_PROXY, M6-01): the ingress controller's pods.
  trustProxy: '10.0.0.0/8'
  # Uploaded documents (designation, agreements): shared by every replica.
  documents:
    storageClass: ''
    size: 20Gi
    accessMode: ReadWriteMany
  # Non-secret settings (see .env.example); the secrets come from rid-api.
  env:
    RID_MAIL_FROM: no-reply@rid.example.org
    RID_SMTP_URL: smtp://smtp.example.org:587
    RID_TSA_URL: https://tsa.example.org
    RID_TRANSPARENCY_LOG_ID: rid-transparency
    RID_GATEWAY_NODES: '2'
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 1Gi }

web:
  replicas: 2
  port: 3000
  env:
    # The realm's ssoSessionIdleTimeout (WCAG 2.2.1, M6-02).
    RID_SESSION_IDLE_SECONDS: '1800'
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

ingress:
  enabled: true
  # Traefik (MIT, as the pilots): the chart adds its Middleware that strips the client-certificate
  # headers Keycloak trusts on the gateway's token route only (ADR-0022). With another controller,
  # it must strip SSL_CLIENT_CERT and ssl-client-verify itself. (ingress-nginx is retired.)
  className: traefik
  annotations: {}
  # The TLS certificate of publicUrl's host (cert-manager or the operator's own).
  tlsSecretName: rid-portal-tls

# --- Keycloak ------------------------------------------------------------------------------------

keycloak:
  image: quay.io/keycloak/keycloak:26.8.0
  replicas: 2
  # The temporary administrator of the first start (its password: KEYCLOAK_ADMIN_PASSWORD).
  bootstrapAdmin: rid-bootstrap
  # rid-citizens simulates the country's digital identity in development; in production the
  # citizen folder uses the national one (RID_CITIZEN_ISSUER).
  citizensRealm: false
  carpetaUrl: ''
  # The realm's mail server (the user and password are KEYCLOAK_SMTP_USER and _PASSWORD).
  smtp:
    host: ''
    port: '587'
    from: no-reply@rid.example.org
    starttls: 'true'
    ssl: 'false'
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { memory: 2Gi }

# --- The network's CA (step-ca) ---------------------------------------------------------------------

stepCa:
  image: smallstep/step-ca:0.30.2
  # The operator's CA material (offline root, ARCHITECTURE §11): root_ca.crt, intermediate_ca.crt
  # and intermediate_ca_key (encrypted with RID_STEP_CA_PROVISIONER_PASSWORD).
  pkiSecret: rid-step-ca-pki
  # SHA-256 of root_ca.crt (`step certificate fingerprint root_ca.crt`): the API pins it.
  rootFingerprint: ''
  storageClass: ''
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 256Mi }

# --- Databases (CloudNativePG, installed by the rid-platform chart) --------------------------------

postgres:
  # Empty: the operator's default PostgreSQL image.
  imageName: ''
  storageClass: ''
  portal:
    # A primary and a replica in another zone (ARCHITECTURE §11).
    instances: 2
    size: 50Gi
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits: { memory: 2Gi }
  keycloak:
    instances: 2
    size: 10Gi
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { memory: 1Gi }
  # Backups (M6-06, ADR-0026): Barman Cloud, the CloudNativePG plugin of rid-platform, to the
  # operator's S3-compatible object store, outside the cluster. Both databases, each under its own
  # name in the same store: the WAL continuously and a base backup a day, so either can be
  # recovered to any moment within the retention (OPERATIONS.md §6). The access key is
  # DB_BACKUP_ACCESS_KEY_ID / DB_BACKUP_SECRET_ACCESS_KEY (rid-db-backup).
  backup:
    enabled: true
    # s3://<bucket>/<path>. Required while enabled.
    destinationPath: ''
    # An S3-compatible store in the operator's own data center (Ceph RGW, SeaweedFS, ...);
    # empty for AWS S3.
    endpointURL: ''
    region: ''
    # A Secret with the CA of that endpoint (key ca.crt), when its certificate is not public.
    endpointCASecret: ''
    # Server-side encryption of the objects: AES256, aws:kms, or empty when the store encrypts by
    # itself. The store's access policy is what keeps them private: barman-cloud has no
    # client-side encryption (ADR-0026).
    encryption: AES256
    retentionPolicy: 30d
    # CloudNativePG's cron, with seconds: every day at 02:00 UTC.
    schedule: '0 0 2 * * *'

# --- Gateway -------------------------------------------------------------------------------------

gateway:
  # ≥ 2 nodes in different zones (ARCHITECTURE §11), each with its local OPA.
  replicas: 2
  topologyKey: topology.kubernetes.io/zone
  # Never two gateways on one node (false only for single-node test clusters).
  onePerNode: true
  service:
    # The gateway terminates the applications' TLS (mTLS): a network load balancer, not an ingress.
    type: LoadBalancer
    annotations: {}
    loadBalancerSourceRanges: []
    # With type NodePort (test clusters).
    nodePort: null
  resources:
    apisix:
      requests: { cpu: '1', memory: 512Mi }
      limits: { memory: 1Gi }
    opa:
      # About 2.5 ms of CPU per decision (docs/performance/M6-03.md).
      requests: { cpu: '1', memory: 256Mi }
      limits: { memory: 512Mi }
    fluentBit:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 256Mi }
  storage:
    storageClass: ''
    # OPA's last bundle (M6-04) and the transparency buffer (never lose a consultation).
    opaSize: 1Gi
    transparencySize: 5Gi

etcd:
  replicas: 3
  storage:
    storageClass: ''
    size: 8Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

wgHub:
  enabled: true
  # The kit nodes reach the hub over UDP from the internet.
  service:
    type: LoadBalancer
    annotations: {}
  subnet: 10.77.0.0/16
  storage:
    storageClass: ''
    size: 1Gi

contractRunner:
  enabled: true

# Access-log analytics: Fluent Bit -> OpenSearch (M5).
accessLogs:
  enabled: true
  replicas: 2
  opensearch:
    host: rid-opensearch
    port: 9200
    tls: true
    # The Secret with the CA of OpenSearch's certificate (key ca.crt): cert-manager's.
    caSecret: rid-opensearch-tls
    # OpenSearch's pods, the only place the pipeline may send to (NetworkPolicy).
    podLabels:
      app.kubernetes.io/name: opensearch

# --- Network ---------------------------------------------------------------------------------------

networkPolicy:
  enabled: true
  # The namespace of the ingress controller that reaches the web and the API.
  ingressControllerNamespace: traefik
  # Where the rid-platform chart runs (the CloudNativePG operator reaches the database pods).
  platformNamespace: rid-platform
  # Private ranges the gateway may call besides public addresses (an X-Road Security Server or
  # providers inside the operator's network). Empty: public addresses only.
  gatewayExtraEgressCidrs: []
  # Private ranges of the services the portal and Keycloak use outside the cluster, when they are not
  # at public addresses: the mail server, the TSA. Empty: public addresses only.
  servicesEgressCidrs: []

# --- Observability (subcharts) ---------------------------------------------------------------------

# Access-log analytics (M5): OpenSearch with its security plugin and TLS (opensearch-security.yaml).
# Users and their password hashes: OPENSEARCH_INTERNAL_USERS_YML in the store (DEPLOYMENT.md §9).
opensearch:
  enabled: true
  fullnameOverride: rid-opensearch
  clusterName: rid-opensearch
  replicas: 3
  labels:
    app.kubernetes.io/part-of: rid
  extraEnvs:
    - { name: DISABLE_INSTALL_DEMO_CONFIG, value: 'true' }
  opensearchJavaOpts: -Xms1g -Xmx1g
  resources:
    requests: { cpu: 500m, memory: 2Gi }
    limits: { memory: 2Gi }
  persistence:
    size: 50Gi
  secretMounts:
    - name: tls
      secretName: rid-opensearch-tls
      path: /usr/share/opensearch/config/certs
  config:
    opensearch.yml: |
      cluster.name: rid-opensearch
      network.host: 0.0.0.0
      plugins.security.ssl.transport.pemcert_filepath: certs/tls.crt
      plugins.security.ssl.transport.pemkey_filepath: certs/tls.key
      plugins.security.ssl.transport.pemtrustedcas_filepath: certs/ca.crt
      plugins.security.ssl.transport.enforce_hostname_verification: true
      plugins.security.ssl.http.enabled: true
      plugins.security.ssl.http.pemcert_filepath: certs/tls.crt
      plugins.security.ssl.http.pemkey_filepath: certs/tls.key
      plugins.security.ssl.http.pemtrustedcas_filepath: certs/ca.crt
      plugins.security.nodes_dn: ['CN=rid-opensearch']
      plugins.security.authcz.admin_dn: ['CN=rid-opensearch-admin']
      plugins.security.allow_default_init_securityindex: true
      plugins.security.restapi.roles_enabled: ['all_access']
  securityConfig:
    enabled: true
    config:
      securityConfigSecret: rid-opensearch-security
      dataComplete: true

# Metrics and alerts (M5-06). Prometheus scrapes the gateway's pods (APISIX and OPA's diagnostic
# listener), the API (with RID_METRICS_TOKEN) and Keycloak; the rules are infra/prometheus's.
prometheus:
  enabled: true
  kube-state-metrics: { enabled: false }
  prometheus-node-exporter: { enabled: false }
  prometheus-pushgateway: { enabled: false }
  server:
    fullnameOverride: rid-prometheus
    # The chart's own labels already name it: this one is for the NetworkPolicies.
    podLabels:
      rid-network: prometheus
    retention: 30d
    persistentVolume: { size: 20Gi }
    extraConfigmapMounts:
      - {
          name: rid-rules,
          mountPath: /etc/rid-rules,
          configMap: rid-prometheus-rules,
          readOnly: true,
        }
    extraSecretMounts:
      - {
          name: metrics-token,
          mountPath: /etc/rid-metrics,
          secretName: rid-prometheus,
          readOnly: true,
        }
  serverFiles:
    prometheus.yml:
      rule_files:
        - /etc/rid-rules/rid.rules.yml
  scrapeConfigs:
    gateway:
      job_name: apisix
      metrics_path: /apisix/prometheus/metrics
      kubernetes_sd_configs: [{ role: pod, namespaces: { own_namespace: true } }]
      relabel_configs:
        - source_labels:
            [
              __meta_kubernetes_pod_label_app_kubernetes_io_name,
              __meta_kubernetes_pod_container_port_name,
            ]
          regex: rid-gateway;metrics
          action: keep
    opa:
      job_name: opa
      kubernetes_sd_configs: [{ role: pod, namespaces: { own_namespace: true } }]
      relabel_configs:
        - source_labels:
            [
              __meta_kubernetes_pod_label_app_kubernetes_io_name,
              __meta_kubernetes_pod_container_port_name,
            ]
          regex: rid-gateway;opa-diag
          action: keep
    api:
      job_name: api
      metrics_path: /metrics
      authorization: { type: Bearer, credentials_file: /etc/rid-metrics/RID_METRICS_TOKEN }
      kubernetes_sd_configs: [{ role: pod, namespaces: { own_namespace: true } }]
      relabel_configs:
        - source_labels:
            [
              __meta_kubernetes_pod_label_app_kubernetes_io_name,
              __meta_kubernetes_pod_container_port_name,
            ]
          regex: rid-api;http
          action: keep
    keycloak:
      job_name: keycloak
      kubernetes_sd_configs: [{ role: pod, namespaces: { own_namespace: true } }]
      relabel_configs:
        - source_labels:
            [
              __meta_kubernetes_pod_label_app_kubernetes_io_name,
              __meta_kubernetes_pod_container_port_name,
            ]
          regex: rid-keycloak;management
          action: keep
  # The operator's mail: the server's password is ALERTMANAGER_SMTP_PASSWORD (rid-alertmanager).
  alertmanager:
    enabled: true
    fullnameOverride: rid-alertmanager
    podLabels:
      app.kubernetes.io/part-of: rid
    extraSecretMounts:
      - { name: smtp, mountPath: /etc/rid-smtp, secretName: rid-alertmanager, readOnly: true }
    config:
      global:
        smtp_smarthost: smtp.example.org:587
        smtp_from: alertas@rid.example.org
        smtp_auth_username: alertas@rid.example.org
        smtp_auth_password_file: /etc/rid-smtp/ALERTMANAGER_SMTP_PASSWORD
        smtp_require_tls: true
      route:
        receiver: operator
        group_by: [alertname, system, kind]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        routes:
          - { matchers: ['severity="critical"'], receiver: operator, repeat_interval: 1h }
      receivers:
        - name: operator
          email_configs:
            - { to: operaciones@rid.example.org, send_resolved: true }

# The operator's dashboard (AGPL-3.0, its own service). Behind the ingress at /grafana, with its
# own login (admin password GRAFANA_ADMIN_PASSWORD, rid-grafana).
grafana:
  enabled: true
  fullnameOverride: rid-grafana
  podLabels:
    app.kubernetes.io/part-of: rid
  admin:
    existingSecret: rid-grafana
    userKey: GRAFANA_ADMIN_USER
    passwordKey: GRAFANA_ADMIN_PASSWORD
  grafana.ini:
    server: { serve_from_sub_path: true }
    users: { allow_sign_up: false, default_language: es-ES }
    auth.anonymous: { enabled: false }
    analytics: { reporting_enabled: false, check_for_updates: false }
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - {
            name: Prometheus,
            uid: prometheus,
            type: prometheus,
            access: proxy,
            url: 'http://rid-prometheus',
            isDefault: true,
            editable: false,
          }
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - { name: rid, folder: RID, type: file, options: { path: /var/lib/grafana/dashboards/rid } }
  dashboardsConfigMaps:
    rid: rid-grafana-dashboards
