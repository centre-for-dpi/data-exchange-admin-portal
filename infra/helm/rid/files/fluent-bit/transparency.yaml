# Transparency pipeline (ADR-0015, ARCHITECTURE.md §13): APISIX tcp-logger -> filter -> portal
# collector. Records carry the keyed pseudonym of the data subject, never the document number, the
# path or any content. Separate from the analytics pipeline (fluent-bit.yaml), which has no data
# subject at all.
service:
  flush: 1
  log_level: warn
  http_server: on
  http_listen: 0.0.0.0
  # The health endpoint; its port comes from the environment: sidecars of one pod need their own.
  http_port: ${FLUENT_BIT_HTTP_PORT}
  health_check: on
  # Chunks live on disk until the collector accepts them: a portal restart loses nothing.
  storage.path: /var/lib/fluent-bit/transparency
  storage.sync: full
  storage.checksum: on
  storage.backlog.mem_limit: 16M

pipeline:
  inputs:
    - name: tcp
      listen: 0.0.0.0
      port: 5170
      format: json
      tag: rid.transparency
      storage.type: filesystem

  filters:
    - name: lua
      match: rid.transparency
      script: /fluent-bit/etc/rid/transparency.lua
      call: transparency

  outputs:
    - name: http
      match: rid.transparency
      host: ${RID_TRANSPARENCY_COLLECTOR_HOST}
      port: ${RID_TRANSPARENCY_COLLECTOR_PORT}
      uri: /api/v1/internal/subject-access
      format: json
      json_date_key: false
      header: Authorization Bearer ${RID_TRANSPARENCY_INGEST_TOKEN}
      # Keep retrying: a record lost here is a consultation the citizen never sees.
      retry_limit: no_limits
      storage.total_limit_size: 1G
