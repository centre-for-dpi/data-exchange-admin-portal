apiVersion: v2
name: den-platform
description: >-
  The cluster's operators the DEN chart builds on (M6-05): CloudNativePG (PostgreSQL with replicas)
  with its Barman Cloud plugin (backups, M6-06), External Secrets Operator (secrets from OpenBao or
  another store) and cert-manager (internal certificates). Installed once per cluster, before the den chart: Helm cannot create an operator
  and its resources in one release, since the resources reach the operator's webhook first.
type: application
version: 0.2.0
appVersion: '0.2.0'
kubeVersion: '>=1.29.0-0'
annotations:
  # Apache-2.0, all four (CLAUDE.md, rule 1).
  licenses: Apache-2.0
dependencies:
  - name: cloudnative-pg
    version: 0.29.1
    repository: https://cloudnative-pg.github.io/charts
    condition: cloudnative-pg.enabled
  # Backups of CloudNativePG's clusters to an object store (M6-06, ADR-0026). In the operator's
  # namespace; its certificates come from cert-manager, so a first install that brings
  # cert-manager too goes in two steps (DEPLOYMENT.md §9.3).
  - name: plugin-barman-cloud
    version: 0.8.1
    repository: https://cloudnative-pg.github.io/charts
    condition: plugin-barman-cloud.enabled
  - name: external-secrets
    version: 2.14.0
    repository: https://charts.external-secrets.io
    condition: external-secrets.enabled
  - name: cert-manager
    version: v1.21.3
    repository: https://charts.jetstack.io
    condition: cert-manager.enabled
