{{- $c := dict "root" . "component" "api" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "den.name" "api" }}
  labels:
    {{- include "den.labels" $c | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "den.selector" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "den.labels" $c | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "den.selector" $c | nindent 14 }}
      initContainers:
        # Pending migrations, as the schema owner (the API itself runs as den_app). Prisma takes an
        # advisory lock: replicas starting together do not migrate twice.
        - name: migrate
          image: {{ include "den.image" (dict "root" . "name" "api") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ['node_modules/.bin/prisma', 'migrate', 'deploy']
          env:
            - name: DATABASE_MIGRATION_URL
              valueFrom:
                secretKeyRef: { name: {{ include "den.name" "migrate" }}, key: DATABASE_MIGRATION_URL }
          securityContext: &containerSecurity
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: db-ca, mountPath: /var/run/den/db-ca, readOnly: true }
      containers:
        - name: api
          image: {{ include "den.image" (dict "root" . "name" "api") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          # The image's default command also migrates and seeds (pilots): here only the server.
          command: ['node', '--enable-source-maps', 'dist/main.js']
          ports:
            - { name: http, containerPort: {{ .Values.api.port }} }
          env:
            {{- include "den.apiEnv" . | nindent 12 }}
          envFrom:
            - secretRef: { name: {{ include "den.name" "api" }} }
          securityContext: *containerSecurity
          readinessProbe:
            httpGet: { path: /api/v1/health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/v1/health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: documents, mountPath: /var/lib/den/documents }
            - { name: db-ca, mountPath: /var/run/den/db-ca, readOnly: true }
            {{- if .Values.opensearch.enabled }}
            - { name: internal-ca, mountPath: /var/run/den/internal-ca, readOnly: true }
            {{- end }}
      volumes:
        - { name: tmp, emptyDir: {} }
        # The database cluster's CA, to verify its certificate (sslmode=verify-full). Only the
        # certificate: the Secret also holds the CA's key, which must not reach the API.
        - name: db-ca
          secret:
            secretName: {{ include "den.name" "db" }}-ca
            items: [{ key: ca.crt, path: ca.crt }]
        {{- if .Values.opensearch.enabled }}
        # OpenSearch's certificate is of the internal CA (NODE_EXTRA_CA_CERTS).
        - name: internal-ca
          secret:
            secretName: {{ include "den.name" "opensearch" }}-tls
            items: [{ key: ca.crt, path: ca.crt }]
        {{- end }}
        - name: documents
          persistentVolumeClaim: { claimName: {{ include "den.name" "api-documents" }} }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "den.name" "api-documents" }}
  labels:
    {{- include "den.labels" $c | nindent 4 }}
  annotations:
    # Uploaded documents outlive the release.
    helm.sh/resource-policy: keep
spec:
  accessModes: [{{ .Values.api.documents.accessMode }}]
  {{- with .Values.api.documents.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.api.documents.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "den.name" "api" }}
  labels:
    {{- include "den.labels" $c | nindent 4 }}
spec:
  selector:
    {{- include "den.selector" $c | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.api.port }}, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "den.name" "api" }}
  labels:
    {{- include "den.labels" $c | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "den.selector" $c | nindent 6 }}
