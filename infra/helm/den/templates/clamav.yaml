{{- if .Values.antivirus.enabled }}
{{- $c := dict "root" . "component" "clamav" }}
{{- /*
Antivirus of uploaded documents (M6-08, ASVS 5.4.3): clamd, GPL-2.0 in its own pod (CLAUDE.md
rule 1). The portal API sends every document to it before storing it (DEN_CLAMAV_URL) and refuses
the upload while it does not answer. freshclam, in the same container, keeps the signatures up to
date from the internet (NetworkPolicy: public HTTPS only). Runs as the image's clamav user with a
read-only root filesystem.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "den.name" "clamav" }}
  labels:
    {{- include "den.labels" $c | nindent 4 }}
spec:
  replicas: {{ .Values.antivirus.replicas }}
  selector:
    matchLabels:
      {{- include "den.selector" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "den.labels" $c | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: clamav
          image: {{ .Values.images.clamav }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - { name: clamd, containerPort: 3310 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          # The first start downloads the signatures before clamd listens.
          startupProbe:
            exec: { command: [clamdcheck.sh] }
            periodSeconds: 15
            failureThreshold: 60
          readinessProbe:
            exec: { command: [clamdcheck.sh] }
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            {{- toYaml .Values.antivirus.resources | nindent 12 }}
          volumeMounts:
            - { name: signatures, mountPath: /var/lib/clamav }
            - { name: run, mountPath: /run/clamav }
            - { name: lock, mountPath: /var/lock }
            - { name: log, mountPath: /var/log/clamav }
            - { name: tmp, mountPath: /tmp }
      volumes:
        # Re-downloaded on each start: no disk to keep.
        - { name: signatures, emptyDir: {} }
        - { name: run, emptyDir: {} }
        - { name: lock, emptyDir: {} }
        - { name: log, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "den.name" "clamav" }}
  labels:
    {{- include "den.labels" $c | nindent 4 }}
spec:
  selector:
    {{- include "den.selector" $c | nindent 4 }}
  ports:
    - { name: clamd, port: 3310, targetPort: clamd }
{{- end }}
