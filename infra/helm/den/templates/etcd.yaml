{{- $c := dict "root" . "component" "etcd" }}
{{- $name := include "den.name" "etcd" }}
{{- /*
etcd for APISIX: a cluster of `etcd.replicas` members (3 in production, ARCHITECTURE §11), each
with its stable name (StatefulSet) and its disk. Only the gateway reaches it (NetworkPolicy).
*/}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "den.labels" $c | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: {{ .Values.etcd.replicas }}
  # Members start together: each waits for the others to form the cluster.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "den.selector" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "den.labels" $c | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: {{ .Values.gateway.topologyKey }}
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "den.selector" $c | nindent 14 }}
      containers:
        - name: etcd
          image: {{ .Values.images.etcd }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          # No shell in the image: Kubernetes expands $(POD_NAME) in the arguments.
          command:
            - etcd
            - --name=$(POD_NAME)
            - --data-dir=/var/lib/etcd
            # Mutual TLS (ASVS 12.3, M6-05): clients (the gateway) and peers present a certificate of
            # the internal CA, or etcd refuses them. It has no other authentication of its own.
            - --listen-client-urls=https://0.0.0.0:2379
            - --advertise-client-urls=https://$(POD_NAME).{{ $name }}:2379
            - --listen-peer-urls=https://0.0.0.0:2380
            - --initial-advertise-peer-urls=https://$(POD_NAME).{{ $name }}:2380
            - --initial-cluster={{- range $i := until (int .Values.etcd.replicas) }}{{ if $i }},{{ end }}{{ $name }}-{{ $i }}=https://{{ $name }}-{{ $i }}.{{ $name }}:2380{{- end }}
            - --cert-file=/etc/etcd/tls/tls.crt
            - --key-file=/etc/etcd/tls/tls.key
            - --trusted-ca-file=/etc/etcd/tls/ca.crt
            - --client-cert-auth=true
            - --peer-cert-file=/etc/etcd/tls/tls.crt
            - --peer-key-file=/etc/etcd/tls/tls.key
            - --peer-trusted-ca-file=/etc/etcd/tls/ca.crt
            - --peer-client-cert-auth=true
            # Health and metrics only, without TLS, for the probes and Prometheus.
            - --listen-metrics-urls=http://0.0.0.0:2381
            - --initial-cluster-token={{ $name }}-{{ .Release.Namespace }}
            - --initial-cluster-state=new
          ports:
            - { name: client, containerPort: 2379 }
            - { name: peer, containerPort: 2380 }
            - { name: metrics, containerPort: 2381 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /health, port: metrics }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /livez, port: metrics }
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            {{- toYaml .Values.etcd.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/etcd }
            - { name: tls, mountPath: /etc/etcd/tls, readOnly: true }
      volumes:
        - name: tls
          secret: { secretName: {{ include "den.name" "etcd-tls" }} }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.etcd.storage.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests: { storage: {{ .Values.etcd.storage.size }} }
---
# Members' names for each other and for APISIX (headless). Not ready members still resolve: the
# cluster forms before any member is ready.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "den.labels" $c | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "den.selector" $c | nindent 4 }}
  ports:
    - { name: client, port: 2379 }
    - { name: peer, port: 2380 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "den.labels" $c | nindent 4 }}
spec:
  # Quorum: a 3-member cluster survives one member down.
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "den.selector" $c | nindent 6 }}
