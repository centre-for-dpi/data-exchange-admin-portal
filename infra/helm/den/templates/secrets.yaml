{{- /*
Each component's Secret, den-<component>, with only its keys (_helpers.tpl, den.secrets).
externalSecrets: External Secrets Operator copies them from one entry of the secret store
(secrets.externalSecrets.remoteKey), each key a property of it, and builds the derived ones.
existing: the operator created them (docs/DEPLOYMENT.md §9.2 lists each Secret's keys).
*/ -}}
{{- if eq .Values.secrets.mode "externalSecrets" }}
{{- $root := . }}
{{- $es := .Values.secrets.externalSecrets }}
{{- range $component, $spec := include "den.secrets" . | fromYaml }}
{{- if eq (include "den.enabled" (dict "root" $root "component" $component)) "true" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "den.name" $component }}
  labels:
    {{- include "den.labels" (dict "root" $root "component" $component) | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    name: {{ include "den.name" $component }}
    creationPolicy: Owner
    deletionPolicy: Retain
    {{- if or $spec.derived $spec.type }}
    template:
      engineVersion: v2
      {{- with $spec.type }}
      type: {{ . }}
      {{- end }}
      {{- if $spec.derived }}
      # Merge: these are added to the copied keys. Replace (typed Secrets): only these.
      mergePolicy: {{ if $spec.type }}Replace{{ else }}Merge{{ end }}
      data:
        {{- range $key, $template := $spec.derived }}
        {{ $key }}: {{ $template | quote }}
        {{- end }}
      {{- end }}
    {{- end }}
  data:
    {{- range $spec.keys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $es.remoteKey }}
        property: {{ . }}
    {{- end }}
{{- end }}
{{- end }}
{{- else if ne .Values.secrets.mode "existing" }}
{{- fail "secrets.mode must be externalSecrets or existing" }}
{{- end }}
