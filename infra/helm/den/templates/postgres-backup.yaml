{{- if .Values.postgres.backup.enabled }}
{{- $b := .Values.postgres.backup }}
{{- $c := dict "root" . "component" "db-backup" }}
{{- $store := include "rid.name" "db-backup" }}
{{- /*
Backups of both databases (M6-06, ADR-0026) with Barman Cloud, the plugin of CloudNativePG that
rid-platform installs. One object store, where each Cluster keeps its base backups and WAL under its
own name; a ScheduledBackup per Cluster. Restoring creates a new Cluster from the store
(OPERATIONS.md §6).
*/}}
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ $store }}
  labels:
    {{- include "rid.labels" $c | nindent 4 }}
spec:
  retentionPolicy: {{ $b.retentionPolicy | quote }}
  configuration:
    destinationPath: {{ required "postgres.backup.destinationPath: the object store of the backups (s3://bucket/path)" $b.destinationPath | quote }}
    {{- with $b.endpointURL }}
    endpointURL: {{ . | quote }}
    {{- end }}
    {{- with $b.endpointCASecret }}
    endpointCA: { name: {{ . }}, key: ca.crt }
    {{- end }}
    s3Credentials:
      accessKeyId: { name: {{ $store }}, key: DB_BACKUP_ACCESS_KEY_ID }
      secretAccessKey: { name: {{ $store }}, key: DB_BACKUP_SECRET_ACCESS_KEY }
      {{- with $b.region }}
      region: { name: {{ $store }}-region, key: REGION }
      {{- end }}
    wal:
      compression: zstd
      {{- with $b.encryption }}
      encryption: {{ . }}
      {{- end }}
    data:
      compression: gzip
      {{- with $b.encryption }}
      encryption: {{ . }}
      {{- end }}
      immediateCheckpoint: true
{{- with $b.region }}
---
# The region, as the plugin reads it: from a Secret key.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $store }}-region
  labels:
    {{- include "rid.labels" $c | nindent 4 }}
stringData:
  REGION: {{ . | quote }}
{{- end }}
{{- range $db := list "db" "keycloak-db" }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ include "rid.name" $db }}-daily
  labels:
    {{- include "rid.labels" $c | nindent 4 }}
spec:
  schedule: {{ $b.schedule | quote }}
  # A first backup right away: point-in-time recovery starts from a base backup.
  immediate: true
  backupOwnerReference: self
  cluster:
    name: {{ include "rid.name" $db }}
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
{{- end }}
{{- end }}
