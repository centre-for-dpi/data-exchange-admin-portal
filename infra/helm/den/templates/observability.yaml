{{- /*
What the observability subcharts read from this chart: the alert rules of infra/prometheus and the
operator's dashboard of infra/grafana (copied by `pnpm helm:sync`).
*/}}
{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "den.name" "prometheus-rules" }}
  labels:
    {{- include "den.labels" (dict "root" . "component" "prometheus") | nindent 4 }}
data:
  den.rules.yml: |
    {{- .Files.Get "files/prometheus/den.rules.yml" | nindent 4 }}
{{- end }}
{{- if .Values.grafana.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "den.name" "grafana-dashboards" }}
  labels:
    {{- include "den.labels" (dict "root" . "component" "grafana") | nindent 4 }}
data:
  den-operator.json: |
    {{- .Files.Get "files/grafana/den-operator.json" | nindent 4 }}
{{- end }}
