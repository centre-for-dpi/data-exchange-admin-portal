apiVersion: v2
name: den
description: >-
  Portal and gateway of the data exchange network (DEN) for production, with the topology of
  docs/ARCHITECTURE.md §11: the portal (web, API), the gateway (APISIX with its local OPA, on
  each node), etcd, the kit nodes' hub and the platform's dependencies.
type: application
version: 0.2.0
appVersion: '0.2.0'
kubeVersion: '>=1.29.0-0'
home: https://github.com/centre-for-dpi/data-exchange-admin-portal
sources:
  - https://github.com/centre-for-dpi/data-exchange-admin-portal
keywords: [data-exchange, api-gateway, apisix, opa, keycloak]
annotations:
  # Every image and dependency is open source with an OSI-approved license (CLAUDE.md, rule 1);
  # Grafana (AGPL-3.0) runs as its own service, never linked with our code.
  licenses: Apache-2.0
dependencies:
  # Access-log analytics (M5), with its security plugin (opensearch-security.yaml).
  - name: opensearch
    version: 3.9.0
    repository: https://opensearch-project.github.io/helm-charts
    condition: opensearch.enabled
  # Metrics and alerts (M5-06): Prometheus with Alertmanager, the rules of infra/prometheus.
  - name: prometheus
    version: 29.40.1
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus.enabled
  # The operator's dashboard (AGPL-3.0, its own service: CLAUDE.md, rule 1).
  - name: grafana
    version: 14.3.1
    repository: https://grafana-community.github.io/helm-charts
    condition: grafana.enabled
