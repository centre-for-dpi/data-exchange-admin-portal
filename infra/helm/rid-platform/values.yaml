# Operators of the cluster (M6-05). Disable the ones the cluster already has.

cloudnative-pg:
  enabled: true

# Barman Cloud (M6-06): false on the very first install when cert-manager comes with this chart,
# true on the upgrade right after (DEPLOYMENT.md §9.3).
plugin-barman-cloud:
  enabled: true

external-secrets:
  enabled: true
  installCRDs: true

cert-manager:
  enabled: true
  crds:
    enabled: true
    # The CRDs outlive the chart: deleting them would delete every certificate.
    keep: true
