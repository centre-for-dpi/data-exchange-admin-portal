# Values of the den chart on the kind test cluster (scripts/helm-kind.mjs). Small, one node, our
# images built locally; the rest is the production chart as it is.
publicUrl: http://den.127.0.0.1.nip.io:18080
gatewayHost: gw.127.0.0.1.nip.io
gatewayPublicUrl: https://gw.127.0.0.1.nip.io:19443

images:
  api: { repository: den/portal-api, tag: kind }
  web: { repository: den/portal-web, tag: kind }
  wgHub: { repository: den/wg-hub, tag: kind }
  contractRunner: { repository: den/contract-runner, tag: kind }

secrets:
  externalSecrets:
    # A fake store of External Secrets with random values (the script): the same path as OpenBao.
    secretStoreRef: { name: den-kind, kind: ClusterSecretStore }
    refreshInterval: 1m

api:
  replicas: 1
  # No TSA in kind: batches stay pending. A placeholder root (a test certificate of
  # packages/transparency-verifier's fixtures), only so the chart renders and the API starts.
  tsa:
    url: https://tsa.example.org/tsr
    requireIndependent: true
    trustedRoots: |
      -----BEGIN CERTIFICATE-----
      MIIBbDCCAROgAwIBAgIQD8LnekFKKRrUHtii0bPcXDAKBggqhkjOPQQDAjAVMRMw
      EQYDVQQDEwpPdGhlciBSb290MB4XDTI2MTExMzEzMDExOVoXDTM2MTExMDEzMDEx
      OVowFTETMBEGA1UEAxMKT3RoZXIgUm9vdDBZMBMGByqGSM49AgEGCCqGSM49AwEH
      A0IABARLdhHJH4aTtYWMDc9j7A5Ma1uydsD7la6RrHXbb9BXBFQUMR31QxER20PO
      A+0/c/xrOaPQDcUg+GAgmHA0zWCjRTBDMA4GA1UdDwEB/wQEAwIBBjASBgNVHRMB
      Af8ECDAGAQH/AgEBMB0GA1UdDgQWBBRefX5H0QzKMWpi9FKF9IyVDLeeIjAKBggq
      hkjOPQQDAgNHADBEAiAuMeIDpoT3CsNR3COrgS1/raUMkPChM8nnYjIUXq/HxQIg
      WIsMgD3tzxQQmqBnyfndgt8V/aWJ99icH+eT6OCGDkk=
      -----END CERTIFICATE-----
  trustProxy: 10.0.0.0/8
  documents: { accessMode: ReadWriteOnce, size: 1Gi }
  resources: { requests: { cpu: 100m, memory: 384Mi }, limits: { memory: 1Gi } }
web:
  replicas: 1
  resources: { requests: { cpu: 50m, memory: 256Mi }, limits: { memory: 768Mi } }

gateway:
  replicas: 1
  onePerNode: false
  service: { type: NodePort, nodePort: 30443 }
  resources:
    apisix: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 1Gi } }
    opa: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }
    fluentBit: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 128Mi } }
  storage: { opaSize: 100Mi, transparencySize: 500Mi }

etcd:
  replicas: 3
  storage: { size: 500Mi }
  resources: { requests: { cpu: 25m, memory: 64Mi }, limits: { memory: 256Mi } }

postgres:
  portal:
    instances: 2
    size: 1Gi
    resources: { requests: { cpu: 50m, memory: 256Mi }, limits: { memory: 512Mi } }
  keycloak:
    instances: 1
    size: 1Gi
    resources: { requests: { cpu: 50m, memory: 256Mi }, limits: { memory: 512Mi } }
  # No object store in kind: the backups are tested with a real one (M6-06).
  backup:
    enabled: false

keycloak:
  replicas: 1
  smtp: { host: localhost }
  resources: { requests: { cpu: 200m, memory: 768Mi }, limits: { memory: 1536Mi } }

stepCa:
  resources: { requests: { cpu: 10m, memory: 64Mi }, limits: { memory: 256Mi } }

# The kit nodes' hub needs the host's tun device; the access logs, OpenSearch (another phase).
wgHub: { enabled: false }
accessLogs: { enabled: false }

networkPolicy:
  ingressControllerNamespace: traefik
  platformNamespace: den-platform

# One clamd is enough to try the uploads (M6-08).
antivirus:
  replicas: 1
