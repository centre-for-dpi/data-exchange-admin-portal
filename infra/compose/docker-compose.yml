# Local development and pilot stack for the DEN portal.
# Start with `pnpm infra:up` (all services) or `pnpm infra:up:core` (without OpenSearch/Fluent Bit).
# Every published port binds to 127.0.0.1 only and can be moved with *_PORT variables in .env.
# Secrets come from the repo-root .env (see .env.example).
name: den

x-healthcheck-defaults: &healthcheck-defaults
  interval: 5s
  timeout: 5s
  retries: 30

services:
  postgres:
    # postgres:18.6-alpine with pgBackRest (infra/postgres, M6-06). Development does not archive;
    # the pilot does (docker-compose.deploy.yml).
    build: ../postgres
    image: den/postgres:local
    networks: [default]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:?set KEYCLOAK_DB_USER in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
      DEN_APP_DB_PASSWORD: ${DEN_APP_DB_PASSWORD:?set DEN_APP_DB_PASSWORD in .env}
    volumes:
      - pg-data:/var/lib/postgresql
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    healthcheck:
      <<: *healthcheck-defaults
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    networks: [default, gateway]
    command:
      - start-dev
      - --import-realm
      # The email event listener (realm den-portal) tells the account owner when a password or a
      # second factor is set or removed (M3-08): a first-use OTP enrollment does not go unnoticed.
      - --spi-events-listener--email--include-events=UPDATE_CREDENTIAL,REMOVE_CREDENTIAL
      # The client certificate of applications arrives from the gateway's token route, which
      # APISIX verified in the handshake (S-4, M3-10): Keycloak reads it from SSL_CLIENT_CERT and
      # trusts ssl-client-verify. Every other way to Keycloak must strip both headers.
      - --spi-x509cert-lookup--provider=nginx
      - --spi-x509cert-lookup--nginx--ssl-client-cert=SSL_CLIENT_CERT
      - --spi-x509cert-lookup--nginx--trust-proxy-verification=true
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?set KEYCLOAK_ADMIN_USER in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HEALTH_ENABLED: 'true'
      # Tokens always carry the browser-facing issuer; containers (APISIX) reach Keycloak by service name.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      # Placeholders resolved by --import-realm in infra/keycloak/*-realm.json (M0-03).
      DEN_PORTAL_WEB_CLIENT_SECRET: ${DEN_PORTAL_WEB_CLIENT_SECRET:?set DEN_PORTAL_WEB_CLIENT_SECRET in .env}
      DEN_GATEWAY_PROVISIONER_SECRET: ${DEN_GATEWAY_PROVISIONER_SECRET:?set DEN_GATEWAY_PROVISIONER_SECRET in .env}
      DEN_WEB_URL: ${DEN_WEB_URL:-http://localhost:3000}
      DEN_CITIZEN_APP_CLIENT_SECRET: ${DEN_CITIZEN_APP_CLIENT_SECRET:?set DEN_CITIZEN_APP_CLIENT_SECRET in .env}
      DEN_CITIZEN_APP_URL: ${DEN_CITIZEN_APP_URL:-http://localhost:3100}
      DEN_DEMO_USER_PASSWORD: ${DEN_DEMO_USER_PASSWORD:-den-demo-password}
      # TOTP key of the seed users with a critical role (M3-08); random in the pilot.
      DEN_DEMO_TOTP_SECRET: ${DEN_DEMO_TOTP_SECRET:-den-demo-totp-secret}
    volumes:
      - ../keycloak:/opt/keycloak/data/import:ro
    ports:
      - 127.0.0.1:${KEYCLOAK_PORT:-8080}:8080
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      # The image has no curl/wget: plain HTTP over bash's /dev/tcp against the management port.
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '",
        ]
      start_period: 30s

  etcd:
    image: quay.io/coreos/etcd:v3.6.16
    networks: [gateway]
    command:
      - etcd
      - --name=etcd0
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd0=http://etcd:2380
    volumes:
      - etcd-data:/etcd-data
    # Not published: only APISIX talks to etcd.
    healthcheck:
      <<: *healthcheck-defaults
      test: ['CMD', 'etcdctl', '--endpoints=http://127.0.0.1:2379', 'endpoint', 'health']

  apisix:
    image: apache/apisix:3.19.0-debian
    networks: [gateway, providers]
    environment:
      # The deployment's own key for the private keys APISIX keeps in etcd (M6-01).
      DEN_APISIX_KEYRING: ${DEN_APISIX_KEYRING:?set DEN_APISIX_KEYRING in .env (16 characters)}
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY:?set APISIX_ADMIN_KEY in .env}
    volumes:
      - ../apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ../apisix/plugins:/usr/local/apisix/den:ro
    # Development only: tests run upstreams with mTLS on the host (M3-03). The deployment removes it.
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:${APISIX_HTTP_PORT:-9080}:9080
      - 127.0.0.1:${APISIX_HTTPS_PORT:-9443}:9443
      # Admin API: host loopback only, for the portal reconciler running with `pnpm dev`.
      - 127.0.0.1:${APISIX_ADMIN_PORT:-9180}:9180
    depends_on:
      etcd:
        condition: service_healthy
      # Its error log goes there (config.yaml): nginx must resolve the name to start.
      fluent-bit-errors:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      # The image has bash but no curl/wget: plain HTTP over /dev/tcp against the status port.
      test:
        [
          'CMD',
          'bash',
          '-c',
          "exec 3<>/dev/tcp/127.0.0.1/7085 && printf 'GET /status/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '",
        ]

  opa-init:
    # OPA runs as uid 1000 and its volume is created as root: give it the persistence directory
    # (M6-04). The step-ca image is already in the stack and has a shell.
    image: smallstep/step-ca:0.30.2
    networks: [gateway]
    entrypoint: ['sh', '-c', 'chown 1000:1000 /var/lib/opa && chmod 700 /var/lib/opa']
    user: root
    volumes:
      - opa-data:/var/lib/opa

  opa:
    image: openpolicyagent/opa:1.21.4-static
    networks: [gateway]
    depends_on:
      opa-init:
        condition: service_completed_successfully
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --log-format=json
      - --config-file=/config/config.yaml
    environment:
      OPA_PORTAL_URL: ${OPA_PORTAL_URL:-http://host.docker.internal:4000/api/v1/opa}
      OPA_BUNDLE_TOKEN: ${OPA_BUNDLE_TOKEN:?set OPA_BUNDLE_TOKEN in .env}
    volumes:
      - ../opa/config.yaml:/config/config.yaml:ro
      # The last bundle, for a restart while the portal is down (M6-04).
      - opa-data:/var/lib/opa
    extra_hosts:
      # Lets OPA reach the portal API running on the host (bundle download, M0-04).
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:${OPA_PORT:-8181}:8181
    healthcheck:
      <<: *healthcheck-defaults
      # No HTTP client in the image: OPA checks itself with http.send. Two statements on purpose:
      # a lone comparison would return `false` (defined) and --fail would pass on a 404.
      test:
        [
          'CMD',
          '/opa',
          'eval',
          '--fail',
          'r := http.send({"method": "get", "url": "http://127.0.0.1:8181/health"}); r.status_code == 200',
        ]

  step-ca:
    image: smallstep/step-ca:0.30.2
    networks: [default]
    environment:
      DOCKER_STEPCA_INIT_NAME: DEN Dev CA
      DOCKER_STEPCA_INIT_DNS_NAMES: localhost,step-ca
      DOCKER_STEPCA_INIT_PROVISIONER_NAME: den-portal
      DOCKER_STEPCA_INIT_PASSWORD: ${STEP_CA_PASSWORD:?set STEP_CA_PASSWORD in .env}
    # The image's entrypoint initialises the CA once; configure.sh then sets the provisioner of
    # the portal (template and durations, M3-01) and starts step-ca.
    command: ['bash', '/den/configure.sh']
    volumes:
      - step-ca-data:/home/step
      - ../step-ca:/den:ro
    ports:
      - 127.0.0.1:${STEP_CA_PORT:-9000}:9000
    healthcheck:
      <<: *healthcheck-defaults
      test:
        [
          'CMD',
          'step',
          'ca',
          'health',
          '--ca-url=https://localhost:9000',
          '--root=/home/step/certs/root_ca.crt',
        ]

  opensearch:
    image: opensearchproject/opensearch:3.9.0
    networks: [default]
    profiles: [observability]
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: 'false'
      # One node on a laptop or a CI runner: a nearly full disk must not block index creation
      # (the flood-stage watermark). Production runs the chart's cluster with its own disks.
      cluster.routing.allocation.disk.threshold_enabled: 'false'
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      # Dev only: no TLS/auth inside the private Compose network. Production uses the security plugin.
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - 127.0.0.1:${OPENSEARCH_PORT:-9200}:9200
    healthcheck:
      <<: *healthcheck-defaults
      test:
        [
          'CMD-SHELL',
          'curl -fsS "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=4s"',
        ]
      start_period: 30s

  fluent-bit:
    image: fluent/fluent-bit:5.1.5-debug
    networks: [default, gateway]
    profiles: [observability]
    command: ['/fluent-bit/bin/fluent-bit', '-c', '/fluent-bit/etc/den/fluent-bit.yaml']
    volumes:
      - ../fluent-bit:/fluent-bit/etc/den:ro
    # Not published: APISIX ships logs over the Compose network (http://fluent-bit:9880).
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      # The -debug image ships curl; the plain image has no tools at all.
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://127.0.0.1:2020/api/v1/health']

  # Metrics and alerts (ARCHITECTURE.md §9, M5-06): Prometheus scrapes the gateway, the portal
  # API (with DEN_METRICS_TOKEN) and OPA, and evaluates the alerts of infra/prometheus/rules;
  # Alertmanager mails them to the operator; Grafana shows the operator's dashboard.
  prometheus:
    image: prom/prometheus:v3.15.1
    networks: [default, gateway]
    profiles: [observability]
    # Prometheus does not expand variables in its configuration: the token goes to the file its
    # scrape job reads (credentials_file), then Prometheus itself runs.
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        mkdir -p /tmp/den && printf %s "$$DEN_METRICS_TOKEN" > /tmp/den/metrics-token &&
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=$$PROMETHEUS_RETENTION
    environment:
      DEN_METRICS_TOKEN: ${DEN_METRICS_TOKEN:?set DEN_METRICS_TOKEN in .env}
      PROMETHEUS_RETENTION: ${PROMETHEUS_RETENTION:-30d}
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # The portal API runs on the host during development: its scrape target is api:4000.
      - api:host-gateway
    ports:
      - 127.0.0.1:${PROMETHEUS_PORT:-9090}:9090
    healthcheck:
      <<: *healthcheck-defaults
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9090/-/ready']

  alertmanager:
    image: prom/alertmanager:v0.34.2
    networks: [default]
    profiles: [observability]
    command: ['--config.file=/etc/alertmanager/alertmanager.yml', '--storage.path=/alertmanager']
    volumes:
      - ../alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - 127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093
    healthcheck:
      <<: *healthcheck-defaults
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9093/-/ready']

  grafana:
    # AGPL-3.0: a separate service, never linked with our code (CLAUDE.md, rule 1).
    image: grafana/grafana:13.3.0
    networks: [default]
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_USERS_DEFAULT_LANGUAGE: es-ES
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001/}
      GF_SERVER_SERVE_FROM_SUB_PATH: ${GRAFANA_SERVE_FROM_SUB_PATH:-false}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/den-operator.json
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-3001}:3000
    healthcheck:
      <<: *healthcheck-defaults
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/api/health']

  # Transparency register (ADR-0015, MT-03): APISIX tcp-logger -> this Fluent Bit -> portal
  # collector. Base profile, separate from the analytics pipeline above: without it, citizens
  # would not see the calls. Buffers on disk and retries while the collector is unreachable.
  fluent-bit-transparency:
    image: fluent/fluent-bit:5.1.5-debug
    networks: [default, gateway]
    command: ['/fluent-bit/bin/fluent-bit', '-c', '/fluent-bit/etc/den/transparency.yaml']
    environment:
      FLUENT_BIT_HTTP_PORT: '2020'
      DEN_TRANSPARENCY_INGEST_TOKEN: ${DEN_TRANSPARENCY_INGEST_TOKEN:?set DEN_TRANSPARENCY_INGEST_TOKEN in .env}
      DEN_TRANSPARENCY_COLLECTOR_HOST: ${DEN_TRANSPARENCY_COLLECTOR_HOST:-host.docker.internal}
      DEN_TRANSPARENCY_COLLECTOR_PORT: ${DEN_TRANSPARENCY_COLLECTOR_PORT:-4000}
    volumes:
      - ../fluent-bit:/fluent-bit/etc/den:ro
      - transparency-buffer:/var/lib/fluent-bit
    extra_hosts:
      # The portal API runs on the host during development.
      - host.docker.internal:host-gateway
    # Not published: APISIX sends records over the Compose network (fluent-bit-transparency:5170).
    healthcheck:
      <<: *healthcheck-defaults
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://127.0.0.1:2020/api/v1/health']

  # Error log of the gateway (M5-01): nginx sends it over syslog; this masks the request line, the
  # upstream URI and any identification number, and prints the result (infra/fluent-bit/
  # gateway-errors.yaml). Base profile: APISIX needs it to start.
  fluent-bit-errors:
    image: fluent/fluent-bit:5.1.5-debug
    networks: [gateway]
    command: ['/fluent-bit/bin/fluent-bit', '-c', '/fluent-bit/etc/den/gateway-errors.yaml']
    environment:
      FLUENT_BIT_HTTP_PORT: '2020'
    volumes:
      - ../fluent-bit:/fluent-bit/etc/den:ro
    # Not published: APISIX sends to fluent-bit-errors:5140/udp over the Compose network.
    healthcheck:
      <<: *healthcheck-defaults
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://127.0.0.1:2020/api/v1/health']

  # Development RFC 3161 time-stamping authority (ADR-0016, MT-04): seals the checkpoints of the
  # transparency register. sigstore timestamp-server (Apache-2.0) with a file signer; tsa-init
  # creates its certificate chain once (infra/tsa/init.sh). In production, the country's
  # accredited TSA.
  tsa-init:
    image: smallstep/step-ca:0.30.2
    networks: [default]
    entrypoint: ['sh', '/init/init.sh']
    user: root
    volumes:
      - ../tsa:/init:ro
      - tsa-data:/tsa

  tsa:
    image: ghcr.io/sigstore/timestamp-server:v2.1.4
    networks: [default]
    command:
      [
        'timestamp-server',
        'serve',
        '--host=0.0.0.0',
        '--port=3004',
        '--timestamp-signer=file',
        '--file-signer-key-path=/tsa/tsa.key',
        '--certificate-chain-path=/tsa/chain.pem',
        '--disable-ntp-monitoring',
      ]
    depends_on:
      tsa-init:
        condition: service_completed_successfully
    volumes:
      - tsa-data:/tsa:ro
    ports:
      - 127.0.0.1:${DEN_TSA_PORT:-3004}:3004
    # Distroless image, nothing to run a health check with: the API retries while it is down.

  # Antivirus of uploaded documents (M6-08): clamd, GPL-2.0 in its own container (CLAUDE.md rule
  # 1). Optional: profile `antivirus`, and DEN_CLAMAV_URL=tcp://localhost:3310 (development) or
  # tcp://clamav:3310 (pilot) for the API. freshclam inside updates the signatures from the
  # internet; the first start takes a few minutes and about 1.2 GB of memory.
  clamav:
    image: clamav/clamav:1.5.4
    profiles: [antivirus]
    networks: [default]
    volumes:
      - clamav-data:/var/lib/clamav
    ports:
      - 127.0.0.1:${CLAMAV_PORT:-3310}:3310
    healthcheck:
      <<: *healthcheck-defaults
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      start_period: 600s

  mailpit:
    image: axllent/mailpit:v1.32.0
    networks: [default]
    ports:
      - 127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025
      - 127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025
    healthcheck:
      <<: *healthcheck-defaults
      test: ['CMD', '/mailpit', 'readyz']

  mock-salud:
    build: &mock-build
      context: ../..
      dockerfile: infra/mock-providers/Dockerfile
    networks: [providers]
    image: den/mock-providers:dev
    environment: &mock-env
      PROVIDER: salud
      PORT: '8000'
      # The gateway's signed assertion (M6-10): verified with the portal's JWKS and logged. The
      # portal runs on the host in development; the pilot sets MOCK_GATEWAY_JWKS_URL.
      DEN_GATEWAY_JWKS_URL: ${MOCK_GATEWAY_JWKS_URL:-http://host.docker.internal:4000/api/v1/gateway/jwks}
      DEN_ASSERTION_REQUIRED: ${MOCK_ASSERTION_REQUIRED:-false}
      # The assertions' iss: the gateway's public URL.
      DEN_ASSERTION_ISSUER: ${DEN_GATEWAY_PUBLIC_URL:-https://localhost:9443}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:${MOCK_SALUD_PORT:-8101}:8000
    healthcheck: &mock-healthcheck
      <<: *healthcheck-defaults
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8000/health']

  mock-socioeconomico:
    # Same image as mock-salud (the build is cached); the provider is chosen by PROVIDER.
    build: *mock-build
    networks: [providers]
    image: den/mock-providers:dev
    environment:
      <<: *mock-env
      PROVIDER: socioeconomico
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:${MOCK_SOCIOECONOMICO_PORT:-8102}:8000
    healthcheck: *mock-healthcheck

  wg-hub:
    # WireGuard hub of the kit nodes (M4-03, ADR-0023): the tunnel, an SNI router to the nodes
    # (APISIX calls wg-hub:8443) and the agent the portal's reconciler drives (:8090). It never
    # forwards packets: nodes only answer the connections it opens.
    build:
      context: ../wg-hub
    networks: [default, providers]
    image: den/wg-hub:dev
    cap_add: [NET_ADMIN]
    devices: ['/dev/net/tun:/dev/net/tun']
    sysctls:
      net.ipv4.ip_forward: '0'
    environment:
      DEN_WG_SUBNET: ${DEN_WG_SUBNET:-10.77.0.0/16}
      DEN_WG_HUB_PRIVATE_KEY: ${DEN_WG_HUB_PRIVATE_KEY:?set DEN_WG_HUB_PRIVATE_KEY in .env}
      DEN_WG_HUB_AGENT_TOKEN: ${DEN_WG_HUB_AGENT_TOKEN:?set DEN_WG_HUB_AGENT_TOKEN in .env}
    ports:
      - 127.0.0.1:${WG_HUB_UDP_PORT:-51820}:51820/udp
      # The agent, for the portal API that runs on the host during development.
      - 127.0.0.1:${WG_HUB_AGENT_PORT:-8095}:8090
    volumes:
      - wg-hub-data:/var/lib/wg-hub
    healthcheck:
      <<: *healthcheck-defaults
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8090/health']

  contract-runner:
    # Contract tests of API versions in review (M4-06): Schemathesis against the sandbox, through
    # the gateway's check routes. Internal API on :8096; only parsed results come back.
    build:
      context: ../contract-runner
    networks: [providers]
    image: den/contract-runner:dev
    environment:
      DEN_CONTRACT_RUNNER_TOKEN: ${DEN_CONTRACT_RUNNER_TOKEN:?set DEN_CONTRACT_RUNNER_TOKEN in .env}
    ports:
      - 127.0.0.1:${CONTRACT_RUNNER_PORT:-8096}:8096
    healthcheck:
      <<: *healthcheck-defaults
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8096/health']

  mock-node:
    # Simulated kit node (M4-03): a test fixture, not the kit (ADR-0011). Profile `nodes`. It
    # waits for an enrollment token in /var/lib/mock-node/token (or DEN_ENROLLMENT_TOKEN), then
    # enrolls, joins the hub and serves mock-salud over mTLS on its tunnel address.
    profiles: [nodes]
    networks: [providers]
    build:
      context: ../mock-node
    image: den/mock-node:dev
    cap_add: [NET_ADMIN]
    devices: ['/dev/net/tun:/dev/net/tun']
    environment:
      DEN_PORTAL_URL: ${MOCK_NODE_PORTAL_URL:-http://host.docker.internal:4000}
      # The gateway's TLS name stays the controlUrl's (localhost in development).
      MOCK_NODE_CONTROL_HOST: apisix
      MOCK_NODE_BACKEND: http://mock-salud:8000
      MOCK_NODE_SERVICES: afiliacion=/salud
      MOCK_NODE_HEARTBEAT_SECONDS: ${MOCK_NODE_HEARTBEAT_SECONDS:-15}
    # Its state lives in an anonymous volume: `up --force-recreate -V` gives a fresh node.
    depends_on:
      wg-hub:
        condition: service_healthy
      mock-salud:
        condition: service_healthy

# Network segmentation (M6-01). `default` is the platform (database, identity, CA, analytics,
# the portal). `gateway` is the gateway's control plane: etcd and OPA have no authentication of
# their own, so only the gateway and the platform's components reach them. `providers` are the
# gateway's upstreams (mock providers, the node hub) and the contract runner: none of them reaches
# etcd, OPA or the database, and the gateway reaches nothing of the platform but what it needs.
networks:
  gateway:
  providers:

volumes:
  pg-data:
  clamav-data:
  etcd-data:
  opa-data:
  step-ca-data:
  opensearch-data:
  transparency-buffer:
  tsa-data:
  wg-hub-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
