# Local development and pilot stack for the RID portal.
# Start with `pnpm infra:up` (all services) or `pnpm infra:up:core` (without OpenSearch/Fluent Bit).
# Every published port binds to 127.0.0.1 only and can be moved with *_PORT variables in .env.
# Secrets come from the repo-root .env (see .env.example).
name: rid

x-healthcheck-defaults: &healthcheck-defaults
  interval: 5s
  timeout: 5s
  retries: 30

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:?set KEYCLOAK_DB_USER in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
      RID_APP_DB_PASSWORD: ${RID_APP_DB_PASSWORD:?set RID_APP_DB_PASSWORD in .env}
    volumes:
      - pg-data:/var/lib/postgresql
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    healthcheck:
      <<: *healthcheck-defaults
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command:
      - start-dev
      - --import-realm
      # The email event listener (realm rid-portal) tells the account owner when a password or a
      # second factor is set or removed (M3-08): a first-use OTP enrollment does not go unnoticed.
      - --spi-events-listener--email--include-events=UPDATE_CREDENTIAL,REMOVE_CREDENTIAL
      # The client certificate of applications arrives from the gateway's token route, which
      # APISIX verified in the handshake (S-4, M3-10): Keycloak reads it from SSL_CLIENT_CERT and
      # trusts ssl-client-verify. Every other way to Keycloak must strip both headers.
      - --spi-x509cert-lookup--provider=nginx
      - --spi-x509cert-lookup--nginx--ssl-client-cert=SSL_CLIENT_CERT
      - --spi-x509cert-lookup--nginx--trust-proxy-verification=true
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?set KEYCLOAK_ADMIN_USER in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HEALTH_ENABLED: 'true'
      # Tokens always carry the browser-facing issuer; containers (APISIX) reach Keycloak by service name.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      # Placeholders resolved by --import-realm in infra/keycloak/*-realm.json (M0-03).
      RID_PORTAL_WEB_CLIENT_SECRET: ${RID_PORTAL_WEB_CLIENT_SECRET:?set RID_PORTAL_WEB_CLIENT_SECRET in .env}
      RID_GATEWAY_PROVISIONER_SECRET: ${RID_GATEWAY_PROVISIONER_SECRET:?set RID_GATEWAY_PROVISIONER_SECRET in .env}
      RID_WEB_URL: ${RID_WEB_URL:-http://localhost:3000}
      RID_CARPETA_CLIENT_SECRET: ${RID_CARPETA_CLIENT_SECRET:?set RID_CARPETA_CLIENT_SECRET in .env}
      RID_CARPETA_URL: ${RID_CARPETA_URL:-http://localhost:3100}
      RID_DEMO_USER_PASSWORD: ${RID_DEMO_USER_PASSWORD:-demo}
      # TOTP key of the seed users with a critical role (M3-08); random in the pilot.
      RID_DEMO_TOTP_SECRET: ${RID_DEMO_TOTP_SECRET:-rid-demo-totp-secret}
    volumes:
      - ../keycloak:/opt/keycloak/data/import:ro
    ports:
      - 127.0.0.1:${KEYCLOAK_PORT:-8080}:8080
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      # The image has no curl/wget: plain HTTP over bash's /dev/tcp against the management port.
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '",
        ]
      start_period: 30s

  etcd:
    image: quay.io/coreos/etcd:v3.6.16
    command:
      - etcd
      - --name=etcd0
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd0=http://etcd:2380
    volumes:
      - etcd-data:/etcd-data
    # Not published: only APISIX talks to etcd.
    healthcheck:
      <<: *healthcheck-defaults
      test: ['CMD', 'etcdctl', '--endpoints=http://127.0.0.1:2379', 'endpoint', 'health']

  apisix:
    image: apache/apisix:3.19.0-debian
    environment:
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY:?set APISIX_ADMIN_KEY in .env}
    volumes:
      - ../apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ../apisix/plugins:/usr/local/apisix/rid:ro
    # Development only: tests run upstreams with mTLS on the host (M3-03). The deployment removes it.
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:${APISIX_HTTP_PORT:-9080}:9080
      - 127.0.0.1:${APISIX_HTTPS_PORT:-9443}:9443
      # Admin API: host loopback only, for the portal reconciler running with `pnpm dev`.
      - 127.0.0.1:${APISIX_ADMIN_PORT:-9180}:9180
    depends_on:
      etcd:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      # The image has bash but no curl/wget: plain HTTP over /dev/tcp against the status port.
      test:
        [
          'CMD',
          'bash',
          '-c',
          "exec 3<>/dev/tcp/127.0.0.1/7085 && printf 'GET /status/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '",
        ]

  opa:
    image: openpolicyagent/opa:1.21.4-static
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --log-format=json
      - --config-file=/config/config.yaml
    environment:
      OPA_PORTAL_URL: ${OPA_PORTAL_URL:-http://host.docker.internal:4000/api/v1/opa}
      OPA_BUNDLE_TOKEN: ${OPA_BUNDLE_TOKEN:?set OPA_BUNDLE_TOKEN in .env}
    volumes:
      - ../opa/config.yaml:/config/config.yaml:ro
    extra_hosts:
      # Lets OPA reach the portal API running on the host (bundle download, M0-04).
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:${OPA_PORT:-8181}:8181
    healthcheck:
      <<: *healthcheck-defaults
      # No HTTP client in the image: OPA checks itself with http.send. Two statements on purpose:
      # a lone comparison would return `false` (defined) and --fail would pass on a 404.
      test:
        [
          'CMD',
          '/opa',
          'eval',
          '--fail',
          'r := http.send({"method": "get", "url": "http://127.0.0.1:8181/health"}); r.status_code == 200',
        ]

  step-ca:
    image: smallstep/step-ca:0.30.2
    environment:
      DOCKER_STEPCA_INIT_NAME: RID Dev CA
      DOCKER_STEPCA_INIT_DNS_NAMES: localhost,step-ca
      DOCKER_STEPCA_INIT_PROVISIONER_NAME: rid-portal
      DOCKER_STEPCA_INIT_PASSWORD: ${STEP_CA_PASSWORD:?set STEP_CA_PASSWORD in .env}
    # The image's entrypoint initialises the CA once; configure.sh then sets the provisioner of
    # the portal (template and durations, M3-01) and starts step-ca.
    command: ['bash', '/rid/configure.sh']
    volumes:
      - step-ca-data:/home/step
      - ../step-ca:/rid:ro
    ports:
      - 127.0.0.1:${STEP_CA_PORT:-9000}:9000
    healthcheck:
      <<: *healthcheck-defaults
      test:
        [
          'CMD',
          'step',
          'ca',
          'health',
          '--ca-url=https://localhost:9000',
          '--root=/home/step/certs/root_ca.crt',
        ]

  opensearch:
    image: opensearchproject/opensearch:3.9.0
    profiles: [observability]
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: 'false'
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      # Dev only: no TLS/auth inside the private Compose network. Production uses the security plugin.
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - 127.0.0.1:${OPENSEARCH_PORT:-9200}:9200
    healthcheck:
      <<: *healthcheck-defaults
      test:
        [
          'CMD-SHELL',
          'curl -fsS "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=4s"',
        ]
      start_period: 30s

  fluent-bit:
    image: fluent/fluent-bit:5.1.5-debug
    profiles: [observability]
    command: ['/fluent-bit/bin/fluent-bit', '-c', '/fluent-bit/etc/rid/fluent-bit.yaml']
    volumes:
      - ../fluent-bit:/fluent-bit/etc/rid:ro
    # Not published: APISIX ships logs over the Compose network (http://fluent-bit:9880).
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      # The -debug image ships curl; the plain image has no tools at all.
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://127.0.0.1:2020/api/v1/health']

  # Transparency register (ADR-0015, MT-03): APISIX tcp-logger -> this Fluent Bit -> portal
  # collector. Base profile, separate from the analytics pipeline above: without it, citizens
  # would not see the calls. Buffers on disk and retries while the collector is unreachable.
  fluent-bit-transparency:
    image: fluent/fluent-bit:5.1.5-debug
    command: ['/fluent-bit/bin/fluent-bit', '-c', '/fluent-bit/etc/rid/transparency.yaml']
    environment:
      RID_TRANSPARENCY_INGEST_TOKEN: ${RID_TRANSPARENCY_INGEST_TOKEN:?set RID_TRANSPARENCY_INGEST_TOKEN in .env}
      RID_TRANSPARENCY_COLLECTOR_HOST: ${RID_TRANSPARENCY_COLLECTOR_HOST:-host.docker.internal}
      RID_TRANSPARENCY_COLLECTOR_PORT: ${RID_TRANSPARENCY_COLLECTOR_PORT:-4000}
    volumes:
      - ../fluent-bit:/fluent-bit/etc/rid:ro
      - transparency-buffer:/var/lib/fluent-bit
    extra_hosts:
      # The portal API runs on the host during development.
      - host.docker.internal:host-gateway
    # Not published: APISIX sends records over the Compose network (fluent-bit-transparency:5170).
    healthcheck:
      <<: *healthcheck-defaults
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://127.0.0.1:2020/api/v1/health']

  # Development RFC 3161 time-stamping authority (ADR-0016, MT-04): seals the checkpoints of the
  # transparency register. sigstore timestamp-server (Apache-2.0) with a file signer; tsa-init
  # creates its certificate chain once (infra/tsa/init.sh). In production, the country's
  # accredited TSA.
  tsa-init:
    image: smallstep/step-ca:0.30.2
    entrypoint: ['sh', '/init/init.sh']
    user: root
    volumes:
      - ../tsa:/init:ro
      - tsa-data:/tsa

  tsa:
    image: ghcr.io/sigstore/timestamp-server:v2.1.4
    command:
      [
        'timestamp-server',
        'serve',
        '--host=0.0.0.0',
        '--port=3004',
        '--timestamp-signer=file',
        '--file-signer-key-path=/tsa/tsa.key',
        '--certificate-chain-path=/tsa/chain.pem',
        '--disable-ntp-monitoring',
      ]
    depends_on:
      tsa-init:
        condition: service_completed_successfully
    volumes:
      - tsa-data:/tsa:ro
    ports:
      - 127.0.0.1:${RID_TSA_PORT:-3004}:3004
    # Distroless image, nothing to run a health check with: the API retries while it is down.

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - 127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025
      - 127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025
    healthcheck:
      <<: *healthcheck-defaults
      test: ['CMD', '/mailpit', 'readyz']

  mock-salud:
    build: &mock-build
      context: ../..
      dockerfile: infra/mock-providers/Dockerfile
    image: rid/mock-providers:dev
    environment:
      PROVIDER: salud
      PORT: '8000'
    ports:
      - 127.0.0.1:${MOCK_SALUD_PORT:-8101}:8000
    healthcheck: &mock-healthcheck
      <<: *healthcheck-defaults
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8000/health']

  mock-socioeconomico:
    # Same image as mock-salud (the build is cached); the provider is chosen by PROVIDER.
    build: *mock-build
    image: rid/mock-providers:dev
    environment:
      PROVIDER: socioeconomico
      PORT: '8000'
    ports:
      - 127.0.0.1:${MOCK_SOCIOECONOMICO_PORT:-8102}:8000
    healthcheck: *mock-healthcheck

  wg-hub:
    # WireGuard hub of the kit nodes (M4-03, ADR-0023): the tunnel, an SNI router to the nodes
    # (APISIX calls wg-hub:8443) and the agent the portal's reconciler drives (:8090). It never
    # forwards packets: nodes only answer the connections it opens.
    build:
      context: ../wg-hub
    image: rid/wg-hub:dev
    cap_add: [NET_ADMIN]
    devices: ['/dev/net/tun:/dev/net/tun']
    sysctls:
      net.ipv4.ip_forward: '0'
    environment:
      RID_WG_SUBNET: ${RID_WG_SUBNET:-10.77.0.0/16}
      RID_WG_HUB_PRIVATE_KEY: ${RID_WG_HUB_PRIVATE_KEY:?set RID_WG_HUB_PRIVATE_KEY in .env}
      RID_WG_HUB_AGENT_TOKEN: ${RID_WG_HUB_AGENT_TOKEN:?set RID_WG_HUB_AGENT_TOKEN in .env}
    ports:
      - 127.0.0.1:${WG_HUB_UDP_PORT:-51820}:51820/udp
      # The agent, for the portal API that runs on the host during development.
      - 127.0.0.1:${WG_HUB_AGENT_PORT:-8095}:8090
    volumes:
      - wg-hub-data:/var/lib/wg-hub
    healthcheck:
      <<: *healthcheck-defaults
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8090/health']

  contract-runner:
    # Contract tests of API versions in review (M4-06): Schemathesis against the sandbox, through
    # the gateway's check routes. Internal API on :8096; only parsed results come back.
    build:
      context: ../contract-runner
    image: rid/contract-runner:dev
    environment:
      RID_CONTRACT_RUNNER_TOKEN: ${RID_CONTRACT_RUNNER_TOKEN:?set RID_CONTRACT_RUNNER_TOKEN in .env}
    ports:
      - 127.0.0.1:${CONTRACT_RUNNER_PORT:-8096}:8096
    healthcheck:
      <<: *healthcheck-defaults
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8096/health']

  mock-node:
    # Simulated kit node (M4-03): a test fixture, not the kit (ADR-0011). Profile `nodes`. It
    # waits for an enrollment token in /var/lib/mock-node/token (or RID_ENROLLMENT_TOKEN), then
    # enrolls, joins the hub and serves mock-salud over mTLS on its tunnel address.
    profiles: [nodes]
    build:
      context: ../mock-node
    image: rid/mock-node:dev
    cap_add: [NET_ADMIN]
    devices: ['/dev/net/tun:/dev/net/tun']
    environment:
      RID_PORTAL_URL: ${MOCK_NODE_PORTAL_URL:-http://host.docker.internal:4000}
      # The gateway's TLS name stays the controlUrl's (localhost in development).
      MOCK_NODE_CONTROL_HOST: apisix
      MOCK_NODE_BACKEND: http://mock-salud:8000
      MOCK_NODE_SERVICES: afiliacion=/salud
      MOCK_NODE_HEARTBEAT_SECONDS: ${MOCK_NODE_HEARTBEAT_SECONDS:-15}
    # Its state lives in an anonymous volume: `up --force-recreate -V` gives a fresh node.
    depends_on:
      wg-hub:
        condition: service_healthy
      mock-salud:
        condition: service_healthy

volumes:
  pg-data:
  etcd-data:
  step-ca-data:
  opensearch-data:
  transparency-buffer:
  tsa-data:
  wg-hub-data:
