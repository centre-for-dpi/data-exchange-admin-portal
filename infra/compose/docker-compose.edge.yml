# Bundled reverse proxy for a single-host install on a server with no proxy of its own
# (install.sh, docs/INSTALL.md). Layered on the pilot:
#
#   docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.deploy.yml \
#     -f infra/compose/docker-compose.edge.yml --env-file .env [--profile observability] up -d
#
# Traefik (MIT) takes 80 and 443 of the host:
#   - the portal's name (RID_PORTAL_HOST): HTTPS ends here, routed by path as in DEPLOYMENT.md §5.2;
#   - the gateway's name (RID_GATEWAY_HOST): TLS passthrough to APISIX 9443, which ends the mTLS of
#     applications and kit nodes with the network CA (SPIKE S-3).
# Routes live in infra/edge/dynamic/, written by install.sh from infra/edge/rid.yml.template.
# No access log: the proxy keeps no paths or query strings (ARCHITECTURE.md §8).

services:
  edge:
    image: traefik:v3.7.17
    restart: unless-stopped
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      # Let's Encrypt (HTTP-01 on port 80), used only when the routers name it (RID_INSTALL_TLS).
      - --certificatesresolvers.le.acme.storage=/var/lib/traefik/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.email=${RID_ACME_EMAIL:-}
      - --log.level=WARN
      - --ping=true
    ports:
      - 80:80
      - 443:443
    volumes:
      - ../edge/dynamic:/etc/traefik/dynamic:ro
      - ../edge/certs:/etc/traefik/certs:ro
      - edge-acme:/var/lib/traefik
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      edge:
        # Containers that call the public names (the API and the web app reach Keycloak at
        # KEYCLOAK_URL) land here without leaving the host: no hairpin NAT, no public DNS needed.
        aliases:
          - ${RID_PORTAL_HOST:?set RID_PORTAL_HOST in .env}
          - ${RID_GATEWAY_HOST:?set RID_GATEWAY_HOST in .env}

volumes:
  edge-acme:
