# Single-host deployment for pilots and demos (the production topology is M6, ARCHITECTURE §11).
# Layered on the development stack:
#
#   docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.deploy.yml \
#     --env-file .env --profile observability up -d --build
#
# The .env comes from `node scripts/make-deploy-env.mjs <public-url>`: random secrets and the
# internal service names. Differences from development:
#   - nothing is published on the host; an existing reverse proxy (Traefik) on the external
#     network TRAEFIK_NETWORK reaches five services by alias, all under one public host:
#       /            -> rid-portal-web:3000   (portal)
#       /api/v1      -> rid-portal-api:4000   (portal API; /api/v1/internal and /api/v1/opa stay
#                                              off the public host)
#       /auth        -> rid-keycloak:8080     (Keycloak, relative path /auth)
#       /gw          -> rid-apisix:9080       (gateway, prefix stripped by the proxy)
#       /mail        -> rid-mailpit:8025      (Mailpit, demo mail, behind MAILPIT_UI_AUTH)
#   - the API and the web app run in containers (apps/*/Dockerfile); the API applies migrations
#     and the idempotent seed on start (RID_ALLOW_SEED=true).

x-no-ports: &no-ports
  ports: !reset []

services:
  postgres:
    <<: *no-ports
    restart: unless-stopped

  keycloak:
    <<: *no-ports
    restart: unless-stopped
    environment:
      KC_HOSTNAME: ${RID_PUBLIC_URL:?set RID_PUBLIC_URL in .env}/auth
      KC_HTTP_RELATIVE_PATH: /auth
      # Health stays at /health/ready on the management port (the health check above).
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: /
      KC_PROXY_HEADERS: xforwarded
    healthcheck:
      # A shared host can take minutes to boot Keycloak (realm import included).
      start_period: 300s
    networks:
      default: {}
      edge:
        aliases: [rid-keycloak]

  etcd:
    restart: unless-stopped

  apisix:
    <<: *no-ports
    restart: unless-stopped
    networks:
      default: {}
      edge:
        aliases: [rid-apisix]

  opa:
    <<: *no-ports
    restart: unless-stopped

  step-ca:
    <<: *no-ports
    restart: unless-stopped

  opensearch:
    <<: *no-ports
    restart: unless-stopped

  fluent-bit:
    restart: unless-stopped

  fluent-bit-transparency:
    restart: unless-stopped

  tsa:
    <<: *no-ports
    restart: unless-stopped

  mailpit:
    <<: *no-ports
    restart: unless-stopped
    environment:
      MP_WEBROOT: /mail
      # Behind a login: Keycloak sends password resets here, so an open inbox would let anyone
      # take over a demo account.
      MP_UI_AUTH: ${MAILPIT_UI_AUTH:?set MAILPIT_UI_AUTH in .env}
    networks:
      default: {}
      edge:
        aliases: [rid-mailpit]

  mock-salud:
    <<: *no-ports
    restart: unless-stopped

  mock-socioeconomico:
    <<: *no-ports
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: rid/portal-api:deploy
    restart: unless-stopped
    env_file: ../../.env
    environment:
      RID_ALLOW_SEED: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      apisix:
        condition: service_healthy
      tsa:
        condition: service_started
    networks:
      default: {}
      edge:
        aliases: [rid-portal-api]

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    image: rid/portal-web:deploy
    restart: unless-stopped
    env_file: ../../.env
    environment:
      AUTH_TRUST_HOST: 'true'
    depends_on:
      api:
        condition: service_healthy
    networks:
      default: {}
      edge:
        aliases: [rid-portal-web]

networks:
  edge:
    name: ${TRAEFIK_NETWORK:-lab-router_default}
    external: true
