name: Images

# Our container images for the Helm chart (infra/helm/den, values.yaml images.*): built, scanned
# for known vulnerabilities and published with their SBOM (M6-05, ASVS 15.1.2 and 15.2.1).
# Runs on a release tag (v1.2.3 publishes 1.2.3, the chart's appVersion) or by hand, where it
# only builds and scans unless `publish` is set.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to ghcr.io after a clean scan
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/centre-for-dpi
  # Trivy by digest (0.76.1): the scanner is itself a supply-chain target, so it is never a
  # moving tag. Third-party actions are pinned by commit for the same reason.
  TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

jobs:
  image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: den-portal-api, context: ., dockerfile: apps/api/Dockerfile }
          - { name: den-portal-web, context: ., dockerfile: apps/web/Dockerfile }
          - { name: den-wg-hub, context: infra/wg-hub, dockerfile: infra/wg-hub/Dockerfile }
          - {
              name: den-contract-runner,
              context: infra/contract-runner,
              dockerfile: infra/contract-runner/Dockerfile,
            }
    env:
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.licenses=Apache-2.0

      # 1. Build into the runner's Docker, without publishing. A release tag is built without
      # reading the layer cache: a stale cached layer shipped a vulnerable nginx in den-wg-hub
      # in v0.2.0, because the base image's fixes never reached a layer already cached. The
      # build still writes the cache, which step 4 reads, so the published image is the layers
      # that were scanned. Manual runs keep the cache.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          no-cache: ${{ github.ref_type == 'tag' }}
          load: true
          tags: ${{ matrix.name }}:scan
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      # 2. Its SBOM (CycloneDX), kept with the run whether or not the scan passes.
      - name: SBOM
        run: |
          mkdir -p sbom
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/out" \
            "$TRIVY_IMAGE" image --quiet --format cyclonedx --output /out/${{ matrix.name }}.cdx.json \
            ${{ matrix.name }}:scan
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.name }}
          path: sbom/${{ matrix.name }}.cdx.json
          retention-days: 90

      # 3. Known vulnerabilities with a fix available, high and critical: the image is not
      # published. An accepted finding goes in .trivyignore with its reason and an expiry.
      - name: Vulnerability scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src:ro" -w /src \
            "$TRIVY_IMAGE" image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 ${{ matrix.name }}:scan

      # 4. Publish, with BuildKit's own SBOM and provenance attestations in the registry (the
      # layers come from the cache of step 1).
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
