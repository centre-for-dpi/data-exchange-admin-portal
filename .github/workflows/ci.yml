name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, licenses
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # typecheck first: turbo builds workspace packages that lint's type-aware rules resolve.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm license:check
      # Known vulnerabilities of the dependencies (M6-01, ASVS 15.2.1): high and critical fail.
      - run: pnpm audit --audit-level high
      # The alerts of ARCHITECTURE.md §9 (M5-06): each fires on its series, none on healthy ones.
      - run: docker run --rm -v "$PWD/infra/prometheus:/p:ro" -w /p/tests --entrypoint promtool prom/prometheus:v3.15.1 test rules den.rules.test.yml

  api-integration:
    name: API integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same PostgreSQL image and init scripts (roles den/den_app, database den_test) as local dev,
      # plus APISIX and etcd: the APISIX reconciler is tested against the real Admin API (M1-08),
      # the development TSA: the transparency evidence is stamped for real (MT-04), and step-ca:
      # application certificates are signed by the real CA (M3-01), and OpenSearch with Fluent Bit:
      # the access-log pipeline and the usage analytics run on the real index (M5).
      - run: cp .env.example .env
      # Keycloak too: the gateway's token route is tested against it (M3-10).
      - run: docker compose -f infra/compose/docker-compose.yml --env-file .env up -d --wait postgres etcd apisix tsa step-ca opa mock-salud opensearch fluent-bit keycloak
      # The TSA has no health check (distroless image): wait until it stamps a real query, and
      # show its log if it never does.
      - name: TSA answers a timestamp query
        run: |
          openssl ts -query -data /etc/hostname -sha256 -cert -out /tmp/q.tsq
          for _ in $(seq 1 30); do
            code=$(curl -s -o /tmp/q.tsr -w '%{http_code}' -H 'content-type: application/timestamp-query' --data-binary @/tmp/q.tsq http://localhost:3004/api/v1/timestamp)
            [ "$code" = 200 ] && exit 0
            sleep 2
          done
          echo "TSA answered $code"; cat /tmp/q.tsr; docker compose -f infra/compose/docker-compose.yml --env-file .env logs --tail 50 tsa
          exit 1
      - run: pnpm exec turbo run build --filter=@den/api^...
      - run: pnpm --filter @den/api test:integration
        env:
          # The contract runner (Schemathesis) is not started here: its checks run with the full
          # local stack (M4-06).
          DEN_CONTRACT_RUNNER_URL: ''
      - name: Logs of the stack when the tests fail
        if: failure()
        run: docker compose -f infra/compose/docker-compose.yml --env-file .env logs --tail 80 tsa keycloak opensearch
      # Compiled code under plain Node: catches CommonJS interop issues Vitest hides.
      - run: pnpm exec turbo run build --filter=@den/api && pnpm --filter @den/api test:dist

  policy:
    name: OPA policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.21.4
      - run: opa check --strict packages/policy
      # OPA's own API authorization (B-15, ADR-0031), outside the bundle.
      - run: opa check --strict infra/opa/authz.rego
      - run: opa test --verbose packages/policy
      # ARCHITECTURE.md §4.2: policy coverage of at least 90 %.
      - run: opa test --coverage --threshold 90 --format=json packages/policy > /dev/null

  restore:
    name: Backup and restore (pgBackRest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      # The pilot's backup and restore procedure, end to end (M6-06, OPERATIONS.md §6): a lost
      # data volume restored, a point-in-time recovery, and an encrypted repository.
      - run: node scripts/restore-test.mjs
