name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, licenses
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # typecheck first: turbo builds workspace packages that lint's type-aware rules resolve.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm license:check

  api-integration:
    name: API integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same PostgreSQL image and init scripts (roles rid/rid_app, database rid_test) as local dev.
      - run: cp .env.example .env
      - run: docker compose -f infra/compose/docker-compose.yml --env-file .env up -d --wait postgres
      - run: pnpm exec turbo run build --filter=@rid/api^...
      - run: pnpm --filter @rid/api test:integration
      # Compiled code under plain Node: catches CommonJS interop issues Vitest hides.
      - run: pnpm exec turbo run build --filter=@rid/api && pnpm --filter @rid/api test:dist

  policy:
    name: OPA policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.21.4
      - run: opa check --strict packages/policy
      - run: opa test --verbose packages/policy
