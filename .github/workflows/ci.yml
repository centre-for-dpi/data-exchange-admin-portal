name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, licenses
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # typecheck first: turbo builds workspace packages that lint's type-aware rules resolve.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm license:check
      # Known vulnerabilities of the dependencies (M6-01, ASVS 15.2.1): high and critical fail.
      - run: pnpm audit --audit-level high
      # The alerts of ARCHITECTURE.md §9 (M5-06): each fires on its series, none on healthy ones.
      - run: docker run --rm -v "$PWD/infra/prometheus:/p:ro" -w /p/tests --entrypoint promtool prom/prometheus:v3.15.1 test rules rid.rules.test.yml

  api-integration:
    name: API integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same PostgreSQL image and init scripts (roles rid/rid_app, database rid_test) as local dev,
      # plus APISIX and etcd: the APISIX reconciler is tested against the real Admin API (M1-08),
      # the development TSA: the transparency evidence is stamped for real (MT-04), and step-ca:
      # application certificates are signed by the real CA (M3-01), and OpenSearch with Fluent Bit:
      # the access-log pipeline and the usage analytics run on the real index (M5).
      - run: cp .env.example .env
      - run: docker compose -f infra/compose/docker-compose.yml --env-file .env up -d --wait postgres etcd apisix tsa step-ca opa mock-salud opensearch fluent-bit
      - run: pnpm exec turbo run build --filter=@rid/api^...
      - run: pnpm --filter @rid/api test:integration
      # Compiled code under plain Node: catches CommonJS interop issues Vitest hides.
      - run: pnpm exec turbo run build --filter=@rid/api && pnpm --filter @rid/api test:dist

  policy:
    name: OPA policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.21.4
      - run: opa check --strict packages/policy
      - run: opa test --verbose packages/policy
      # ARCHITECTURE.md §4.2: policy coverage of at least 90 %.
      - run: opa test --coverage --threshold 90 --format=json packages/policy > /dev/null
